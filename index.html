<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️ Portal Mágico da Tatá ⭐️</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f1a">

	<link rel="apple-touch-icon" href="icone.svg">
    <link rel="icon" type="image/svg+xml" href="icone.svg">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            touch-action: none;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
		/* ADICIONAR ESTAS LINHAS: */
		overscroll-behavior: none; /* Desativa o "puxar para atualizar" e o ressalto do navegador */
		-webkit-touch-callout: none; /* Evita que apareçam menus ao manter o dedo premido no iOS */
		-webkit-user-select: none; /* Garante que não seleciona texto acidentalmente */
		user-select: none;	
			
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Botão Voltar ao Portal (Apenas a casinha) */
        #btnVoltar {
            position: absolute;
            top: 15px;
            right: 15px; /* Canto superior direito */
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.15s, background 0.15s;
        }

        #btnVoltar:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Ecrã Inicial / Hub */
        #portalHome {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }

        .titulo-portal {
            font-size: 42px;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4), 2px 3px 6px rgba(0,0,0,0.6);
            margin-bottom: 35px;
            text-align: center;
        }

        .painel-ritmo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 45px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 28px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .label-ritmo {
            font-size: 16px;
            font-weight: bold;
            color: #E0E0FF;
            margin-bottom: 10px;
        }

        .botoes-ritmo {
            display: flex;
            gap: 10px;
        }

        .btn-ritmo {
            padding: 8px 16px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            color: #E0E0FF;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ritmo.ativo {
            background: #FF9F1A;
            color: white;
            border-color: #FFD700;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 159, 26, 0.6);
        }

        /* Grelha das Apps */
        .grid-apps {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            max-width: 900px;
            width: 100%;
        }

        .card-app {
            width: 130px;
            height: 125px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(6px);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            text-align: center;
        }

        .card-app:active {
            transform: scale(0.93);
        }

        .card-app.toque { border-color: #3380FF; box-shadow: 0 4px 15px rgba(51, 128, 255, 0.25); }
        .card-app.pintura { border-color: #FFE680; box-shadow: 0 4px 15px rgba(255, 230, 128, 0.25); }
        .card-app.baloes { border-color: #A3E9C4; box-shadow: 0 4px 15px rgba(163, 233, 196, 0.25); }
        .card-app.escondidas { border-color: #DCB3FF; box-shadow: 0 4px 15px rgba(220, 179, 255, 0.25); }
        .card-app.encaixe { border-color: #FF9F1A; box-shadow: 0 4px 15px rgba(255, 159, 26, 0.25); }
        .card-app.instrumentos { border-color: #C084FC; box-shadow: 0 4px 15px rgba(192, 132, 252, 0.25); }
        .card-app.aquario { border-color: #4DD0E1; box-shadow: 0 4px 15px rgba(77, 208, 225, 0.25); }

        .card-app .icon {
            font-size: 40px;
            margin-bottom: 6px;
            line-height: 1;
        }

        .card-app .nome {
            font-size: 13px;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <button id="btnVoltar">🏠</button>

    <div id="portalHome">
        <div class="titulo-portal">⭐️ Portal Mágico da Tatá ⭐️</div>

        <div class="painel-ritmo">
            <div class="label-ritmo">Ritmo do Jogo:</div>
            <div class="botoes-ritmo">
                <button class="btn-ritmo" data-multiplicador="0.6">Lento 🐢</button>
                <button class="btn-ritmo ativo" data-multiplicador="1.0">Normal 🎈</button>
                <button class="btn-ritmo" data-multiplicador="1.5">Rápido 🚀</button>
            </div>
        </div>

        <div class="grid-apps">
            <div class="card-app toque" onclick="abrirJogo('toque')">
                <div class="icon">✨</div>
                <div class="nome">Toque Mágico</div>
            </div>
            <div class="card-app pintura" onclick="abrirJogo('pintura')">
                <div class="icon">🎨</div>
                <div class="nome">Pintura Mágica</div>
            </div>
            <div class="card-app baloes" onclick="abrirJogo('baloes')">
                <div class="icon">🎈</div>
                <div class="nome">Balões Mágicos</div>
            </div>
            <div class="card-app escondidas" onclick="abrirJogo('escondidas')">
                <div class="icon">🙈</div>
                <div class="nome">Quem Está Escondido?</div>
            </div>
            <div class="card-app encaixe" onclick="abrirJogo('encaixe')">
                <div class="icon">🧩</div>
                <div class="nome">Encaixe Mágico</div>
            </div>
            <div class="card-app instrumentos" onclick="abrirJogo('instrumentos')">
                <div class="icon">🎵</div>
                <div class="nome">Instrumentos Mágicos</div>
            </div>
            <div class="card-app aquario" onclick="abrirJogo('aquario')">
                <div class="icon">🐠</div>
                <div class="nome">Aquário Mágico</div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const portalHome = document.getElementById('portalHome');
        const btnVoltar = document.getElementById('btnVoltar');
        const botoesRitmo = document.querySelectorAll('.btn-ritmo');

        let audioCtx;
        let jogoAtual = null; 
        let multiplicadorRitmo = 1.0;
        let largura, altura;

        botoesRitmo.forEach(btn => {
            btn.addEventListener('click', () => {
                botoesRitmo.forEach(b => b.classList.remove('ativo'));
                btn.classList.add('ativo');
                multiplicadorRitmo = parseFloat(btn.getAttribute('data-multiplicador'));
            });
        });

        function redimensionar() {
            largura = canvas.width = window.innerWidth;
            altura = canvas.height = window.innerHeight;
            if (jogoAtual === 'escondidas') reconfigurarEsconderijos();
            if (jogoAtual === 'encaixe') reconfigurarEncaixes();
            if (jogoAtual === 'instrumentos') reconfigurarInstrumentos();
            if (jogoAtual === 'aquario') reconfigurarAquario();
        }
        window.addEventListener('resize', redimensionar);

        function iniciarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function abrirJogo(nomeJogo) {
            iniciarAudio();
            jogoAtual = nomeJogo;
            portalHome.style.display = 'none';
            btnVoltar.style.display = 'flex';

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            redimensionar();
            iniciarEstadoJogo(nomeJogo);
        }

        btnVoltar.addEventListener('click', () => {
            jogoAtual = null;
            portalHome.style.display = 'flex';
            btnVoltar.style.display = 'none';
        });

        /* =================================================================
           SISTEMA DE SOM GERAL E NOTAS (Motor Sintetizador Atualizado)
           ================================================================= */
        const NOTAS_GERAIS = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
        
        function tocarNotaMusical() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const freq = NOTAS_GERAIS[Math.floor(Math.random() * NOTAS_GERAIS.length)];
            const agora = audioCtx.currentTime + 0.02;
            
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, agora);
            gain.gain.linearRampToValueAtTime(0.15, agora + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, agora + 1.0);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(agora);
            osc.stop(agora + 1.0);
        }

        function tocarSomPop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const agora = audioCtx.currentTime + 0.02;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(550, agora);
            osc.frequency.exponentialRampToValueAtTime(120, agora + 0.09);
            gain.gain.setValueAtTime(0.35, agora);
            gain.gain.linearRampToValueAtTime(0, agora + 0.09);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(agora); osc.stop(agora + 0.09);
        }

        function tocarSomMagico() {
            if (!audioCtx) return;
            const notas = [523.25, 659.25, 783.99, 1046.50];
            const agora = audioCtx.currentTime + 0.02;
            notas.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const inicio = agora + (index * 0.07);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, inicio);
                gain.gain.setValueAtTime(0.25, inicio);
                gain.gain.exponentialRampToValueAtTime(0.001, inicio + 0.35);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(inicio); osc.stop(inicio + 0.35);
            });
        }

        function tocarSomVitoriaEncaixe() {
            if (!audioCtx) return;
            const notasFesta = [329.63, 392.00, 523.25, 659.25];
            const agora = audioCtx.currentTime + 0.02;
            notasFesta.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const inicio = agora + (index * 0.12);
                gain.gain.setValueAtTime(0, inicio);
                gain.gain.linearRampToValueAtTime(0.2, inicio + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, inicio + 0.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(inicio); osc.stop(inicio + 0.8);
            });
        }

        function iniciarEstadoJogo(nome) {
            if (nome === 'toque') {
                formasToque = [];
                particulasToque = [];
            } else if (nome === 'pintura') {
                rastoPintura = [];
                matizPintura = 0;
            } else if (nome === 'baloes') {
                baloes = [];
                particulasBaloes = [];
                sorpresasBaloes = [];
                contadorSemEspecial = 0;
                let raioBase = Math.min(largura, altura) * 0.10;
                for (let i = 0; i < MAX_BALOES; i++) {
                    baloes.push(criarNovoBalao(i, true, raioBase));
                }
                ultimoTempoBaloes = performance.now();
            } else if (nome === 'escondidas') {
                estrelasDescoberta = [];
                reconfigurarEsconderijos();
                prepararSonsAnimais();
            } else if (nome === 'encaixe') {
                iniciarNovaSequenciaEncaixe();
            } else if (nome === 'instrumentos') {
                particulasInstrumentos = [];
                reconfigurarInstrumentos();
            } else if (nome === 'aquario') {
                reconfigurarAquario();
            }
        }

        function criarNovoBalao(colunaIndex, inicio = false, raioBase) {
            const larguraColuna = largura / MAX_BALOES;
            const rx = (raioBase || Math.min(largura, altura) * 0.10) * (0.85 + Math.random() * 0.2);
            const ry = rx * 1.3;
            const xCentro = (colunaIndex + 0.5) * larguraColuna;
            const amplitudeMax = (larguraColuna / 2) - rx - 5;
            const amplitudeOscilacao = Math.max(5, Math.min(amplitudeMax, 15));

            let y = inicio 
                ? altura + ry + (colunaIndex * (altura / MAX_BALOES) * 0.7)
                : altura + ry + (Math.random() * 100);

            const especiaisNoEcra = baloes.filter(b => b.especial && !b.morto).length;
            let eEspecial = false;
            
            if (especiaisNoEcra < 2 && contadorSemEspecial >= 2) {
                eEspecial = true;
                contadorSemEspecial = 0;
            } else {
                contadorSemEspecial++;
            }

            return {
                coluna: colunaIndex,
                rx: rx, ry: ry,
                xCentro: xCentro, y: y, currentX: xCentro,
                velocidadeY: (1.2 + Math.random() * 1.1) * multiplicadorRitmo,
                oscilacaoX: Math.random() * Math.PI * 2,
                velocidadeOscilacao: (0.018 + Math.random() * 0.012) * multiplicadorRitmo,
                amplitudeOscilacao: amplitudeOscilacao,
                corInfo: PALETA_BALOES[Math.floor(Math.random() * PALETA_BALOES.length)],
                especial: eEspecial, tempoVida: Math.random() * 100, morto: false
            };
        }

        /* =================================================================
           LÓGICA: QUEM ESTÁ ESCONDIDO? — A PORTA ENTREABERTA
           Uma única porta grande e colorida, integrada no estilo mágico
           do Portal. Dois olhos espreitam pela fresta; ao tocar, a porta
           abre, o animal cresce e aparece com o seu som.
           ================================================================= */
        const ANIMAIS_ESCONDIDOS = [
            { tipo:'urso',  nome:'Urso',       cor:'#8D6E63', emoji:'🐻' },
            { tipo:'vaca',  nome:'Vaca',       cor:'#7E57C2', emoji:'🐮' },
            { tipo:'gato',  nome:'Gato',       cor:'#FF9800', emoji:'🐱' },
            { tipo:'cao',   nome:'Cão',        cor:'#42A5F5', emoji:'🐶' },
            { tipo:'porco', nome:'Porquinho',  cor:'#EC407A', emoji:'🐷' }
        ];
        let portaEscondida = null;
        let estrelasDescoberta = [];
        let ultimoEventoEscondido = 0;

        const AUDIO_ANIMAIS_LOCAIS = {
            cao: 'audio/cao.ogg', gato: 'audio/gato.ogg', porco: 'audio/porquinho.ogg',
            vaca: 'audio/vaca.ogg', urso: 'audio/urso.ogg'
        };
        let somAnimalAtual = null;
        const sonsAnimaisCache = {};

        function getRaioPortaEscondida() {
            return Math.min(largura * 0.24, altura * 0.30);
        }

        function escolherAnimalDiferente(excepto) {
            const opcoes = ANIMAIS_ESCONDIDOS.filter(a => a.tipo !== excepto);
            return opcoes[Math.floor(Math.random() * opcoes.length)] || ANIMAIS_ESCONDIDOS[0];
        }

        function reconfigurarEsconderijos() {
            const r = getRaioPortaEscondida();
            portaEscondida = {
                x: largura * 0.50,
                y: altura * 0.53,
                animal: portaEscondida ? portaEscondida.animal : ANIMAIS_ESCONDIDOS[Math.floor(Math.random()*ANIMAIS_ESCONDIDOS.length)],
                abertura: 0,
                salto: 0,
                brilho: 0,
                tempoFecho: 0,
                proximoAnimal: 0,
                fase: Math.random()*Math.PI*2,
                batida: 0
            };
        }

        function tocarSomAnimal(tipo) {
            if (somAnimalAtual) {
                try { somAnimalAtual.pause(); somAnimalAtual.currentTime = 0; } catch(e) {}
                somAnimalAtual = null;
            }
            const caminho = AUDIO_ANIMAIS_LOCAIS[tipo];
            if (!caminho) return;
            try {
                let audio = sonsAnimaisCache[tipo];
                if (!audio) {
                    audio = new Audio(caminho);
                    audio.preload = 'auto';
                    audio.volume = 0.78;
                    sonsAnimaisCache[tipo] = audio;
                }
                audio.currentTime = 0;
                somAnimalAtual = audio;
                audio.play().catch(() => {});
                audio.onended = () => { if (somAnimalAtual === audio) somAnimalAtual = null; };
            } catch(e) {}
        }

        function prepararSonsAnimais() {
            Object.entries(AUDIO_ANIMAIS_LOCAIS).forEach(([tipo, caminho]) => {
                try {
                    const a = new Audio(caminho);
                    a.preload = 'auto';
                    a.volume = 0.78;
                    sonsAnimaisCache[tipo] = a;
                } catch(e) {}
            });
        }

        function abrirPortaEscondida() {
            if (!portaEscondida || portaEscondida.abertura > 0.75) return;
            iniciarAudio();
            portaEscondida.abertura = 0.001;
            portaEscondida.salto = 1;
            portaEscondida.brilho = 1;
            portaEscondida.batida = 1;
            portaEscondida.tempoFecho = performance.now() + 2700;
            tocarSomAnimal(portaEscondida.animal.tipo);

            const r = getRaioPortaEscondida();
            for (let i=0;i<26;i++) {
                const ang = Math.random()*Math.PI*2;
                const vel = 1 + Math.random()*3.5;
                estrelasDescoberta.push({
                    x:portaEscondida.x, y:portaEscondida.y-r*0.15,
                    vx:Math.cos(ang)*vel, vy:Math.sin(ang)*vel-2,
                    r:3+Math.random()*6, vida:1, rot:Math.random()*6
                });
            }
        }

        function atualizarPortasEscondidas(agora) {
            if (!portaEscondida) reconfigurarEsconderijos();
            const p = portaEscondida;
            if (p.abertura > 0 && agora >= p.tempoFecho) {
                p.abertura = -0.01;
                p.proximoAnimal = agora + 650;
            }
            if (p.abertura < 0 && p.proximoAnimal && agora >= p.proximoAnimal) {
                p.animal = escolherAnimalDiferente(p.animal.tipo);
                p.abertura = 0;
                p.proximoAnimal = 0;
                p.batida = 0;
            }
            const alvo = p.abertura < 0 ? 0 : (p.abertura > 0 ? 1 : 0);
            p.abertura += (alvo - p.abertura) * 0.14;
            if (p.salto > 0) { p.salto *= 0.86; if (p.salto < 0.02) p.salto = 0; }
            p.brilho *= 0.91;
            p.batida *= 0.90;

            for (let i=estrelasDescoberta.length-1;i>=0;i--) {
                const e=estrelasDescoberta[i];
                e.x+=e.vx; e.y+=e.vy; e.vy+=0.08; e.vx*=0.99; e.vida-=0.025; e.rot+=0.12;
                if(e.vida<=0) estrelasDescoberta.splice(i,1);
            }
        }

        function desenharPortaEscondida(p, r, agora) {
            const abertura = Math.max(0, Math.min(1,p.abertura));
            const centroY = altura * 0.56;
            const portaW = r * 1.48;
            const portaH = r * 2.05;
            const topo = centroY - portaH/2;
            const fundo = centroY + portaH/2;
            const pulsar = 1 + Math.sin(agora*0.004 + p.fase)*0.012;
            const animalY = fundo - r*0.56 - p.salto*r*0.30;

            // Aura discreta, mantendo a linguagem visual dos restantes jogos.
            ctx.save();
            ctx.globalAlpha = 0.22 + abertura*0.16;
            ctx.shadowBlur = 32;
            ctx.shadowColor = p.animal.cor;
            ctx.fillStyle = p.animal.cor;
            ctx.beginPath(); ctx.ellipse(p.x, centroY, portaW*0.72, portaH*0.66, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            // Interior escuro: dá profundidade à porta entreaberta.
            ctx.save();
            ctx.fillStyle = '#090A16';
            ctx.shadowBlur = 24; ctx.shadowColor = p.animal.cor;
            ctx.beginPath();
            ctx.roundRect(p.x-portaW/2, topo, portaW, portaH, r*0.22);
            ctx.fill();
            ctx.lineWidth = r*0.055;
            ctx.strokeStyle = p.animal.cor;
            ctx.stroke();
            ctx.restore();

            // Animal dentro da porta: cresce quando a descoberta acontece.
            if (abertura > 0.03) {
                const escalaAnimal = 0.52 + abertura*0.55 + p.salto*0.12;
                ctx.save();
                ctx.translate(p.x, animalY);
                ctx.scale(escalaAnimal*pulsar, escalaAnimal*pulsar);
                ctx.globalAlpha = Math.min(1, 0.25 + abertura*0.9);
                desenharIlustracaoAnimal(0,0,p.animal.tipo,r*0.70);
                ctx.globalAlpha = 1;
                ctx.restore();
            }

            // Folha da porta: gira/abre para o lado, como uma porta real.
            ctx.save();
            ctx.translate(p.x-portaW*0.04, centroY);
            const rot = -abertura*0.78;
            ctx.rotate(rot);
            ctx.translate(-portaW*0.50,0);
            const grad = ctx.createLinearGradient(0,-portaH/2,portaW,portaH/2);
            grad.addColorStop(0, p.animal.cor);
            grad.addColorStop(0.55, 'rgba(255,255,255,0.28)');
            grad.addColorStop(1, p.animal.cor);
            ctx.fillStyle=grad;
            ctx.shadowBlur=18; ctx.shadowColor='rgba(0,0,0,0.45)';
            ctx.beginPath(); ctx.roundRect(0,-portaH/2,portaW*0.56,portaH,r*0.18); ctx.fill();
            ctx.shadowBlur=0;
            ctx.lineWidth=r*0.035; ctx.strokeStyle='rgba(255,255,255,0.52)'; ctx.stroke();
            // ripas da porta
            ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=Math.max(2,r*0.018);
            for(let i=1;i<5;i++) { const xx=portaW*0.56*i/5; ctx.beginPath(); ctx.moveTo(xx,-portaH*0.42); ctx.lineTo(xx,portaH*0.42); ctx.stroke(); }
            // maçaneta
            ctx.fillStyle='#FFD54F'; ctx.shadowBlur=10; ctx.shadowColor='#FFD54F';
            ctx.beginPath(); ctx.arc(portaW*0.47, r*0.05, r*0.075,0,Math.PI*2); ctx.fill();
            ctx.restore();

            // Olhos: a pista principal antes de abrir.
            if (abertura < 0.55) {
                const olhoY = centroY - r*0.34;
                const pisca = Math.sin(agora*0.0027 + p.fase) > 0.992;
                ctx.save();
                ctx.shadowBlur=14; ctx.shadowColor='#FFF176';
                ctx.fillStyle='#FFFDF2';
                ctx.beginPath(); ctx.ellipse(p.x-r*0.19,olhoY,r*0.14,r*0.12,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(p.x+r*0.19,olhoY,r*0.14,r*0.12,0,0,Math.PI*2); ctx.fill();
                ctx.shadowBlur=0; ctx.fillStyle='#263238';
                if (!pisca) {
                    ctx.beginPath(); ctx.arc(p.x-r*0.19,olhoY,r*0.055,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(p.x+r*0.19,olhoY,r*0.055,0,Math.PI*2); ctx.fill();
                } else {
                    ctx.fillRect(p.x-r*0.28,olhoY-2,r*0.18,4); ctx.fillRect(p.x+r*0.10,olhoY-2,r*0.18,4);
                }
                ctx.restore();
            }

            if (abertura > 0.55) {
                ctx.save();
                ctx.font=`bold ${Math.max(20,Math.min(32,r*0.34))}px sans-serif`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillStyle='rgba(255,255,255,0.96)'; ctx.shadowBlur=9; ctx.shadowColor='#000';
                ctx.fillText(p.animal.nome,p.x,topo-r*0.20);
                ctx.restore();
            }
        }

        /* =================================================================
           LÓGICA: ENCAIXE MÁGICO
           ================================================================= */
        function reconfigurarEncaixes() {
            const tam = Math.min(largura, altura) * 0.12;
            const ladoEsquerdoX = largura * 0.28;
            const ladoDireitoX = largura * 0.75;

            if (pecaPaiEncaixe) {
                pecaPaiEncaixe.tamanho = tam;
                pecaPaiEncaixe.startX = ladoDireitoX;
                pecaPaiEncaixe.startY = altura * 0.5;
                if (!pecaPaiEncaixe.arrastando) {
                    pecaPaiEncaixe.x = pecaPaiEncaixe.startX;
                    pecaPaiEncaixe.y = pecaPaiEncaixe.startY;
                }
            }

            if (encaixes.length === 2) {
                encaixes[0].x = ladoEsquerdoX;
                encaixes[0].y = altura * 0.3;
                encaixes[0].tamanho = tam;

                encaixes[1].x = ladoEsquerdoX;
                encaixes[1].y = altura * 0.7;
                encaixes[1].tamanho = tam;
            }
        }

        function iniciarNovaSequenciaEncaixe() {
            emTransicaoEncaixe = false;
            const formaCerta = TIPOS_FORMAS[Math.floor(Math.random() * TIPOS_FORMAS.length)];
            let formaErrada = TIPOS_FORMAS[Math.floor(Math.random() * TIPOS_FORMAS.length)];
            while (formaErrada === formaCerta) {
                formaErrada = TIPOS_FORMAS[Math.floor(Math.random() * TIPOS_FORMAS.length)];
            }

            const corPeca = CORES_ENCAIXE[Math.floor(Math.random() * CORES_ENCAIXE.length)];
            const posicaoCerta = Math.random() < 0.5 ? 0 : 1;

            encaixes = [
                { tipo: posicaoCerta === 0 ? formaCerta : formaErrada, eCorreta: posicaoCerta === 0 },
                { tipo: posicaoCerta === 1 ? formaCerta : formaErrada, eCorreta: posicaoCerta === 1 }
            ];

            pecaPaiEncaixe = {
                tipo: formaCerta,
                cor: corPeca,
                arrastando: false
            };

            reconfigurarEncaixes();
        }

        /* =================================================================
           INSTRUMENTOS MÁGICOS
           ================================================================= */
        const TIPOS_INSTRUMENTOS = ['xilofone', 'tambor', 'sino', 'maracas'];
        const CORES_INSTRUMENTOS = ['#FF8A65', '#64B5F6', '#81C784', '#FFD54F'];

        function reconfigurarInstrumentos() {
            const portrait = altura > largura;
            const marg = Math.min(largura, altura) * 0.045;
            const gap = Math.min(largura, altura) * 0.035;
            const topo = altura * 0.12;
            const baseLivre = altura * 0.80;
            let cols = portrait ? 2 : 4;
            let rows = portrait ? 2 : 1;
            const celW = (largura - marg * 2 - gap * (cols - 1)) / cols;
            const celH = (baseLivre - gap * (rows - 1)) / rows;

            instrumentos = TIPOS_INSTRUMENTOS.map((tipo, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                return {
                    tipo,
                    x: marg + col * (celW + gap) + celW / 2,
                    y: topo + row * (celH + gap) + celH / 2,
                    w: celW,
                    h: celH,
                    pulso: 0,
                    brilho: 0,
                    nota: 0
                };
            });
        }

        function pontoNoInstrumento(x, y, inst) {
            return Math.abs(x - inst.x) <= inst.w * 0.47 && Math.abs(y - inst.y) <= inst.h * 0.45;
        }

        function tocarSomInstrumento(tipo) {
            if (!audioCtx) return;
            const agora = audioCtx.currentTime + 0.01;
            const notas = {
                xilofone: [261.63, 329.63, 392.00, 523.25],
                tambor: [110, 82.41, 65.41],
                sino: [783.99, 1046.50, 1318.51],
                maracas: [180, 240, 320]
            }[tipo];

            if (tipo === 'tambor') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, agora);
                osc.frequency.exponentialRampToValueAtTime(55, agora + 0.16);
                gain.gain.setValueAtTime(0.5, agora);
                gain.gain.exponentialRampToValueAtTime(0.001, agora + 0.18);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(agora); osc.stop(agora + 0.19);
                return;
            }

            const qtd = tipo === 'maracas' ? 4 : 3;
            for (let i = 0; i < qtd; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const inicio = agora + i * (tipo === 'maracas' ? 0.035 : 0.07);
                const freq = notas[(Math.floor(Math.random() * notas.length))] * (tipo === 'maracas' ? (0.9 + Math.random() * 0.35) : 1);
                osc.type = tipo === 'sino' ? 'sine' : 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, inicio);
                gain.gain.linearRampToValueAtTime(tipo === 'maracas' ? 0.08 : 0.18, inicio + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, inicio + (tipo === 'sino' ? 0.9 : 0.22));
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(inicio); osc.stop(inicio + (tipo === 'sino' ? 0.95 : 0.25));
            }
        }

        function criarParticulasInstrumento(x, y, cor) {
            for (let i = 0; i < 14; i++) {
                particulasInstrumentos.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: -Math.random() * 7 - 1,
                    raio: Math.random() * 5 + 2,
                    opacidade: 1,
                    cor
                });
            }
        }

        function ativarInstrumento(i) {
            const inst = instrumentos[i];
            if (!inst) return;
            iniciarAudio();
            inst.pulso = 1;
            inst.brilho = 1;
            inst.nota = Math.random();
            ultimoInstrumento = i;
            tocarSomInstrumento(inst.tipo);
            criarParticulasInstrumento(inst.x, inst.y - inst.h * 0.05, CORES_INSTRUMENTOS[i]);
        }

        function desenharInstrumento(inst, i) {
            const p = 1 + inst.pulso * 0.045;
            ctx.save();
            ctx.translate(inst.x, inst.y);
            ctx.scale(p, p);

            // Cartão grande e arredondado
            ctx.fillStyle = 'rgba(255,255,255,0.07)';
            ctx.shadowBlur = 18;
            ctx.shadowColor = CORES_INSTRUMENTOS[i];
            ctx.beginPath();
            const r = Math.min(inst.w, inst.h) * 0.08;
            ctx.roundRect(-inst.w*0.47, -inst.h*0.45, inst.w*0.94, inst.h*0.9, r);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (inst.tipo === 'xilofone') {
                const barW = inst.w * 0.58, barH = Math.min(inst.h * 0.12, 42);
                const cores = ['#EF5350','#FFCA28','#66BB6A','#42A5F5','#AB47BC','#FF7043'];
                for (let k = 0; k < 6; k++) {
                    const yy = -barH*3 + k * barH*1.12;
                    const ww = barW * (0.72 + k*0.055);
                    ctx.fillStyle = cores[k];
                    ctx.beginPath(); ctx.roundRect(-ww/2, yy, ww, barH*0.72, barH*0.25); ctx.fill();
                }
                ctx.fillStyle = '#C9A66B';
                ctx.beginPath(); ctx.arc(-barW*0.58, inst.h*0.24, barH*0.34, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(barW*0.58, inst.h*0.24, barH*0.34, 0, Math.PI*2); ctx.fill();
            } else if (inst.tipo === 'tambor') {
                const rr = Math.min(inst.w, inst.h) * 0.25;
                ctx.fillStyle = '#D97A36';
                ctx.beginPath(); ctx.ellipse(0, 0, rr*1.45, rr, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFF3D6';
                ctx.beginPath(); ctx.ellipse(0, -rr*0.12, rr*1.28, rr*0.68, 0, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#8D4B24'; ctx.lineWidth = Math.max(5, rr*0.07);
                for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k*rr*0.45, rr*0.45); ctx.lineTo(k*rr*0.35, -rr*0.5); ctx.stroke(); }
                ctx.fillStyle = '#F4C27A';
                ctx.beginPath(); ctx.arc(-rr*0.9, -rr*0.95, rr*0.13, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(rr*0.9, -rr*0.95, rr*0.13, 0, Math.PI*2); ctx.fill();
            } else if (inst.tipo === 'sino') {
                const rr = Math.min(inst.w, inst.h) * 0.24;
                ctx.fillStyle = '#FFD54F';
                ctx.beginPath(); ctx.arc(0, -rr*0.05, rr*0.95, Math.PI, Math.PI*2); ctx.lineTo(rr*1.05, rr*0.8); ctx.lineTo(-rr*1.05, rr*0.8); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#FFF3A0';
                ctx.beginPath(); ctx.arc(-rr*0.3, -rr*0.35, rr*0.25, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#E0A900';
                ctx.fillRect(-rr*0.12, rr*0.75, rr*0.24, rr*0.28);
                ctx.beginPath(); ctx.arc(0, rr*1.02, rr*0.22, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#FFE082'; ctx.lineWidth = Math.max(5, rr*0.06);
                ctx.beginPath(); ctx.moveTo(0, -rr*1.15); ctx.lineTo(0, -rr*0.95); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, -rr*1.25, rr*0.16, 0, Math.PI*2); ctx.fill();
            } else {
                const rr = Math.min(inst.w, inst.h) * 0.22;
                [-1,1].forEach(side => {
                    ctx.save(); ctx.translate(side*rr*0.72, 0); ctx.rotate(side*0.16);
                    ctx.fillStyle = '#8BC34A';
                    ctx.beginPath(); ctx.ellipse(0, 0, rr*0.72, rr*1.05, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#DFF5B0';
                    ctx.beginPath(); ctx.ellipse(0, -rr*0.48, rr*0.55, rr*0.18, 0, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#689F38'; ctx.lineWidth = Math.max(4, rr*0.06);
                    for (let k=0;k<4;k++){ ctx.beginPath(); ctx.moveTo(-rr*0.45+k*rr*0.3, rr*0.15); ctx.lineTo(-rr*0.45+k*rr*0.3, rr*0.8); ctx.stroke(); }
                    ctx.restore();
                });
            }

            if (inst.brilho > 0) {
                ctx.globalAlpha = inst.brilho * 0.45;
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.arc(-inst.w*0.27, -inst.h*0.25, Math.min(inst.w, inst.h)*0.055, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        /* =================================================================
           AQUÁRIO MÁGICO
           ================================================================= */
        function reconfigurarAquario() {
            const n = 6;
            const r = Math.min(largura, altura) * 0.055;
            peixesAquario = Array.from({length:n}, (_, i) => ({
                x: largura * (0.12 + Math.random()*0.76),
                y: altura * (0.20 + Math.random()*0.58),
                r: r * (0.95 + Math.random()*0.35),
                vx: (0.45 + Math.random()*0.55) * (i%2 ? -1 : 1),
                fase: Math.random()*Math.PI*2,
                cor: CORES_PEIXES[i % CORES_PEIXES.length],
                brilho: 0,
                virado: i%2 ? -1 : 1,
                cauda: 0
            }));
            bolhasAquario = [];
            ondasAquario = [];
            for (let i=0;i<18;i++) criarBolhaAquario(Math.random()*largura, altura*(0.25+Math.random()*0.7), true);
        }

        function criarBolhaAquario(x,y,solta=false) {
            bolhasAquario.push({x,y,r:2+Math.random()*7,vx:(Math.random()-0.5)*0.35,vy:-(0.45+Math.random()*0.9),opacidade:solta?0.35:1, vida:solta?1:2});
        }

        function tocarSomPeixeAquario() {
            if (!audioCtx) return;
            const agora=audioCtx.currentTime+0.01;
            const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
            osc.type='sine';
            osc.frequency.setValueAtTime(330+Math.random()*180, agora);
            osc.frequency.exponentialRampToValueAtTime(660+Math.random()*180, agora+0.16);
            gain.gain.setValueAtTime(0.001, agora);
            gain.gain.linearRampToValueAtTime(0.11, agora+0.025);
            gain.gain.exponentialRampToValueAtTime(0.001, agora+0.38);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(agora); osc.stop(agora+0.4);
        }

        function tocarBolhaAquario() {
            if (!audioCtx) return;
            const agora=audioCtx.currentTime+0.01;
            const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
            osc.type='sine'; osc.frequency.setValueAtTime(520,agora); osc.frequency.exponentialRampToValueAtTime(900,agora+0.08);
            gain.gain.setValueAtTime(0.001,agora); gain.gain.linearRampToValueAtTime(0.055,agora+0.015); gain.gain.exponentialRampToValueAtTime(0.001,agora+0.16);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(agora); osc.stop(agora+0.18);
        }

        function tocarAquario(x,y) {
            iniciarAudio();
            let escolhido=null, melhor=Infinity;
            peixesAquario.forEach(peixe=>{
                const d=Math.hypot(x-peixe.x,y-peixe.y);
                if(d < peixe.r*2.0 && d<melhor){melhor=d; escolhido=peixe;}
            });
            if(escolhido){
                escolhido.brilho=1; escolhido.cauda=1; escolhido.vx *= -1; escolhido.virado *= -1;
                tocarSomPeixeAquario();
                for(let i=0;i<8;i++) criarBolhaAquario(escolhido.x+(Math.random()-0.5)*escolhido.r*1.5, escolhido.y-escolhido.r*0.3);
                ondasAquario.push({x:escolhido.x,y:escolhido.y,r:escolhido.r*0.35,opacidade:0.75});
            } else {
                tocarBolhaAquario();
                for(let i=0;i<5;i++) criarBolhaAquario(x+(Math.random()-0.5)*25,y+(Math.random()-0.5)*18);
                ondasAquario.push({x,y,r:8,opacidade:0.6});
            }
        }

        function desenharPeixeAquario(p, agora) {
            const r=p.r, s=p.virado;
            ctx.save(); ctx.translate(p.x,p.y); ctx.scale(s,1);
            ctx.globalAlpha=1;
            ctx.shadowBlur=p.brilho*24; ctx.shadowColor='#FFFFFF';
            ctx.fillStyle=p.cor;
            ctx.beginPath(); ctx.ellipse(0,0,r*1.35,r*0.78,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-r*1.05,0); ctx.lineTo(-r*1.85,-r*0.7); ctx.lineTo(-r*1.75,r*0.7); ctx.closePath(); ctx.fill();
            ctx.shadowBlur=0;
            ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(r*0.25,-r*0.23,r*0.42,r*0.16,-0.25,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(r*0.72,-r*0.18,r*0.22,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#263238'; ctx.beginPath(); ctx.arc(r*0.78,-r*0.18,r*0.10,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(r*0.81,-r*0.23,r*0.035,0,Math.PI*2); ctx.fill();
            ctx.strokeStyle='rgba(80,50,100,0.28)'; ctx.lineWidth=Math.max(2,r*0.05);
            ctx.beginPath(); ctx.arc(r*0.2,0,r*0.38,0.4,2.7); ctx.stroke();
            ctx.restore();
        }

        function desenharAquarioFundo() {
            const g=ctx.createLinearGradient(0,0,0,altura);
            g.addColorStop(0,'#075985'); g.addColorStop(0.55,'#0891B2'); g.addColorStop(1,'#164E63');
            ctx.fillStyle=g; ctx.fillRect(0,0,largura,altura);
            ctx.fillStyle='rgba(255,255,255,0.08)';
            for(let i=0;i<7;i++){
                ctx.beginPath(); ctx.arc(largura*(0.08+i*0.16),altura*0.15,Math.min(largura,altura)*0.055,0,Math.PI*2); ctx.fill();
            }
            ctx.fillStyle='#166534';
            for(let i=0;i<12;i++){
                const x=(i+0.5)*largura/12, h=altura*(0.10+((i*37)%7)/50);
                ctx.beginPath(); ctx.moveTo(x-8,altura); ctx.quadraticCurveTo(x-20,altura-h*0.5,x-8,altura-h); ctx.quadraticCurveTo(x+3,altura-h*0.55,x+8,altura-h*1.1); ctx.quadraticCurveTo(x+12,altura-h*0.45,x+18,altura); ctx.closePath(); ctx.fill();
            }
            ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font=`bold ${Math.max(20,Math.min(30,largura*0.026))}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText('Toca nos peixinhos 🐠',largura/2,altura*0.055);
        }

        /* =================================================================
           GESTOR DE EVENTOS COM MULTITOUCH SEGURO (PointerEvents)
           ================================================================= */
        const toquesAtivos = new Set();
        let mouseBaixoPintura = false;

        canvas.addEventListener('pointerdown', (e) => {
            if (!jogoAtual) return;
            if (toquesAtivos.has(e.pointerId)) return;
            toquesAtivos.add(e.pointerId);

            const rect = canvas.getBoundingClientRect();
            const ptX = e.clientX - rect.left;
            const ptY = e.clientY - rect.top;

            if (jogoAtual === 'toque') {
                iniciarAudio();
                formasToque.push(new FormaMagica(ptX, ptY));
                tocarNotaMusical();
                const corP = CORES_TOQUE[Math.floor(Math.random() * CORES_TOQUE.length)];
                for (let i = 0; i < 8; i++) {
                    particulasToque.push(new ParticulaToque(ptX, ptY, corP));
                }
            } else if (jogoAtual === 'pintura') {
                iniciarAudio();
                mouseBaixoPintura = true;
                adicionarPontoPintura(ptX, ptY);
            } else if (jogoAtual === 'baloes') {
                iniciarAudio();
                // Ciclo para garantir que cada dedo rebenta no máximo um balão
                for (let i = 0; i < baloes.length; i++) {
                    const b = baloes[i];
                    if (!b.morto) {
                        const dx = ptX - b.currentX;
                        const dy = ptY - b.y;
                        if ((dx * dx) / (b.rx * b.rx) + (dy * dy) / (b.ry * b.ry) <= 1.2) {
                            if (b.especial) {
                                tocarSomMagico();
                                const coresEsp = [b.corInfo.luz, '#FFD700', '#FFF', '#00E5FF', '#FF007F'];
                                for (let j = 0; j < 50; j++) {
                                    const c = coresEsp[Math.floor(Math.random() * coresEsp.length)];
                                    particulasBaloes.push(new ParticulaBalao(b.currentX, b.y, c, true));
                                }
                                sorpresasBaloes.push(new SurpresaFlutuante(b.currentX, b.y));
                            } else {
                                tocarSomPop();
                                for (let j = 0; j < 30; j++) {
                                    particulasBaloes.push(new ParticulaBalao(b.currentX, b.y, b.corInfo.base));
                                }
                            }
                            b.morto = true;
                            break; // Para imediatamente para este dedo não rebentar mais nenhum
                        }
                    }
                }
            } else if (jogoAtual === 'escondidas') {
                if (portaEscondida && Math.hypot(ptX-portaEscondida.x, ptY-(altura*0.56)) < getRaioPortaEscondida()*1.55) {
                    abrirPortaEscondida();
                }
            } else if (jogoAtual === 'instrumentos') {
                for (let i = instrumentos.length - 1; i >= 0; i--) {
                    if (pontoNoInstrumento(ptX, ptY, instrumentos[i])) {
                        ativarInstrumento(i);
                        break;
                    }
                }
            } else if (jogoAtual === 'aquario') {
                tocarAquario(ptX, ptY);
            } else if (jogoAtual === 'encaixe') {
                iniciarAudio();
                if (emTransicaoEncaixe || !pecaPaiEncaixe) return;
                const dist = Math.hypot(ptX - pecaPaiEncaixe.x, ptY - pecaPaiEncaixe.y);
                if (dist < pecaPaiEncaixe.tamanho * 1.8) {
                    pecaPaiEncaixe.arrastando = true;
                }
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!jogoAtual) return;
            const rect = canvas.getBoundingClientRect();
            const ptX = e.clientX - rect.left;
            const ptY = e.clientY - rect.top;

            if (jogoAtual === 'pintura' && mouseBaixoPintura) {
                adicionarPontoPintura(ptX, ptY);
            } else if (jogoAtual === 'encaixe' && pecaPaiEncaixe && pecaPaiEncaixe.arrastando) {
                pecaPaiEncaixe.x = ptX;
                pecaPaiEncaixe.y = ptY;
            }
        });

        function limparToque(e) {
            toquesAtivos.delete(e.pointerId);
            mouseBaixoPintura = false;
            soltarEncaixe();
        }

        canvas.addEventListener('pointerup', limparToque);
        canvas.addEventListener('pointercancel', limparToque);

        function soltarEncaixe() {
            if (jogoAtual !== 'encaixe' || !pecaPaiEncaixe || !pecaPaiEncaixe.arrastando || emTransicaoEncaixe) return;
            pecaPaiEncaixe.arrastando = false;

            const encaixeCerto = encaixes.find(en => en.eCorreta);
            const dist = Math.hypot(pecaPaiEncaixe.x - encaixeCerto.x, pecaPaiEncaixe.y - encaixeCerto.y);

            if (dist < pecaPaiEncaixe.tamanho * 1.2) {
                emTransicaoEncaixe = true;
                pecaPaiEncaixe.x = encaixeCerto.x;
                pecaPaiEncaixe.y = encaixeCerto.y;
                tocarSomVitoriaEncaixe();
                
                for (let i = 0; i < 40; i++) {
                    particulasEncaixe.push({
                        x: encaixeCerto.x, y: encaixeCerto.y,
                        vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14,
                        raio: Math.random() * 6 + 2, cor: pecaPaiEncaixe.cor, opacidade: 1
                    });
                }

                setTimeout(iniciarNovaSequenciaEncaixe, 1200);
            } else {
                pecaPaiEncaixe.x = pecaPaiEncaixe.startX;
                pecaPaiEncaixe.y = pecaPaiEncaixe.startY;
            }
        }

        /* =================================================================
           CLASSES DE EFEITOS E OBJETOS
           ================================================================= */
        class ParticulaToque {
            constructor(x, y, cor) {
                this.x = x; this.y = y; this.cor = cor;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.raio = Math.random() * 3 + 1;
                this.opacidade = 1;
            }
            atualizar() {
                this.x += this.vx; this.y += this.vy;
                this.vy += 0.1; this.opacidade -= 0.03; this.raio *= 0.97;
            }
            desenhar(ctx) {
                if (this.opacidade <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacidade;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.raio, 0, Math.PI * 2);
                ctx.fillStyle = this.cor; ctx.shadowBlur = 10; ctx.shadowColor = this.cor;
                ctx.fill(); ctx.restore();
            }
        }

        class FormaMagica {
            constructor(x, y) {
                this.x = x; this.y = y; this.tamanho = 10;
                this.corBase = CORES_TOQUE[Math.floor(Math.random() * CORES_TOQUE.length)];
                this.tipo = TIPOS_FORMAS[Math.floor(Math.random() * TIPOS_FORMAS.length)];
                this.opacidade = 1; this.vy = -0.5;
                this.rotacao = Math.random() * Math.PI * 2;
                this.velocidadeRotacao = (Math.random() - 0.5) * 0.05;
            }
            atualizar() {
                this.tamanho += 2.5; this.y += this.vy;
                this.rotacao += this.velocidadeRotacao; this.opacidade -= 0.012;
            }
            desenhar(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(this.opacidade, 0);
                ctx.translate(this.x, this.y); ctx.rotate(this.rotacao);
                desenharFormaGenerica(ctx, 0, 0, this.tamanho, this.tipo, this.corBase);
                ctx.restore();
            }
        }

        class PontoRasto {
            constructor(x, y, matiz) {
                this.x = x; this.y = y; this.raio = 25;
                this.cor = `hsl(${matiz}, 100%, 60%)`;
                this.opacidade = 1;
            }
            atualizar() {
                this.opacidade -= 0.02; this.raio *= 0.96;
            }
            desenhar(ctx) {
                if (this.opacidade <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacidade;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.raio, 0, Math.PI * 2);
                ctx.shadowBlur = 15; ctx.shadowColor = this.cor;
                ctx.fillStyle = this.cor; ctx.fill(); ctx.restore();
            }
        }

        function adicionarPontoPintura(x, y) {
            rastoPintura.push(new PontoRasto(x, y, matizPintura));
            matizPintura = (matizPintura + 2) % 360;
            const agora = Date.now();
            if (agora - ultimoSomPintura > 150) {
                ultimoSomPintura = agora;
                tocarNotaMusical();
            }
        }

        class ParticulaBalao {
            constructor(x, y, cor, ehEstrela = false) {
                this.x = x; this.y = y; this.cor = cor; this.ehEstrela = ehEstrela;
                this.tamanho = ehEstrela ? (6 + Math.random() * 8) : (4 + Math.random() * 6);
                const ang = Math.random() * Math.PI * 2;
                const forca = ehEstrela ? (6 + Math.random() * 10) : (3 + Math.random() * 8);
                this.vx = Math.cos(ang) * forca; this.vy = Math.sin(ang) * forca;
                this.gravidade = ehEstrela ? 0.12 : 0.2; this.atrito = 0.96;
                this.vida = 1.0; this.velocidadeMorte = 0.015 + Math.random() * 0.015;
                this.rotacao = Math.random() * Math.PI * 2;
            }
            atualizar(dt) {
                this.vx *= Math.pow(this.atrito, dt); this.vy *= Math.pow(this.atrito, dt);
                this.vy += this.gravidade * dt; this.x += this.vx * dt; this.y += this.vy * dt;
                this.vida -= this.velocidadeMorte * dt; this.rotacao += 0.1 * dt;
            }
            desenhar(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.vida);
                ctx.translate(this.x, this.y); ctx.rotate(this.rotacao);
                ctx.fillStyle = this.cor;
                if (this.ehEstrela) {
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.tamanho, -Math.sin((18 + i * 72) * Math.PI / 180) * this.tamanho);
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.tamanho/2), -Math.sin((54 + i * 72) * Math.PI / 180) * (this.tamanho/2));
                    }
                    ctx.closePath(); ctx.fill();
                } else {
                    ctx.fillRect(-this.tamanho/2, -this.tamanho/2, this.tamanho, this.tamanho);
                }
                ctx.restore();
            }
        }

        class SurpresaFlutuante {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.emoji = EMOJIS_SURPRESA[Math.floor(Math.random() * EMOJIS_SURPRESA.length)];
                this.escala = 0.4; this.escalaAlvo = 6.2; this.opacidade = 1.0; this.vy = -2.2;
            }
            atualizar(dt) {
                if (this.escala < this.escalaAlvo) this.escala += 0.12 * dt;
                this.y += this.vy * dt; this.opacidade -= 0.009 * dt;
            }
            desenhar(ctx) {
                if (this.opacidade <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacidade);
                ctx.font = `${Math.floor(40 * this.escala)}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        /* =================================================================
           DESENHOS AUXILIARES
           ================================================================= */
        function desenharFormaGenerica(ctx, x, y, tamanho, tipo, cor, eSilhueta = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();

            if (tipo === 'circulo') {
                ctx.arc(0, 0, tamanho, 0, Math.PI * 2);
            } else if (tipo === 'quadrado') {
                if(ctx.roundRect) ctx.roundRect(-tamanho, -tamanho, tamanho * 2, tamanho * 2, tamanho * 0.2);
                else ctx.rect(-tamanho, -tamanho, tamanho * 2, tamanho * 2);
            } else if (tipo === 'triangulo') {
                ctx.moveTo(0, -tamanho * 1.2);
                ctx.lineTo(tamanho * 1.1, tamanho * 0.8);
                ctx.lineTo(-tamanho * 1.1, tamanho * 0.8);
                ctx.closePath();
            } else if (tipo === 'estrela') {
                const picos = 5;
                const rExt = tamanho * 1.3, rInt = tamanho * 0.6;
                let ang = (Math.PI / 2) * 3, passo = Math.PI / picos;
                ctx.moveTo(0, -rExt);
                for (let i = 0; i < picos; i++) {
                    ctx.lineTo(Math.cos(ang) * rExt, Math.sin(ang) * rExt); ang += passo;
                    ctx.lineTo(Math.cos(ang) * rInt, Math.sin(ang) * rInt); ang += passo;
                }
                ctx.closePath();
            }

            if (eSilhueta) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; 
                ctx.fill();
                ctx.lineWidth = 3; 
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.setLineDash([8, 8]); 
                ctx.stroke();
            } else {
                ctx.fillStyle = cor; ctx.shadowBlur = 15; ctx.shadowColor = cor;
                ctx.fill();
            }
            ctx.restore();
        }

        function desenharBalao(b, dt) {
            ctx.save();
            b.tempoVida += 0.05 * dt;
            const x = b.currentX, y = b.y, rx = b.rx, ry = b.ry;

            if (b.especial) {
                const pulso = Math.sin(b.tempoVida * 4) * 8;
                ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 22 + pulso;
            } else {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)'; ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 8;
            }

            ctx.beginPath();
            ctx.moveTo(x, y - ry);
            ctx.bezierCurveTo(x + rx * 1.15, y - ry, x + rx * 1.1, y + ry * 0.35, x + rx * 0.25, y + ry * 0.88);
            ctx.bezierCurveTo(x + rx * 0.1, y + ry, x - rx * 0.1, y + ry, x - rx * 0.25, y + ry * 0.88);
            ctx.bezierCurveTo(x - rx * 1.1, y + ry * 0.35, x - rx * 1.15, y - ry, x, y - ry);
            ctx.closePath();

            const grad = ctx.createRadialGradient(x - rx * 0.35, y - ry * 0.35, rx * 0.05, x - rx * 0.1, y + ry * 0.1, ry * 1.15);
            grad.addColorStop(0, b.corInfo.luz); grad.addColorStop(0.45, b.corInfo.base); grad.addColorStop(1, b.corInfo.sombra);
            ctx.fillStyle = grad; ctx.fill();
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath(); ctx.ellipse(x - rx * 0.38, y - ry * 0.42, rx * 0.22, ry * 0.13, -Math.PI / 4, 0, Math.PI * 2); ctx.fill();

            if (b.especial) {
                ctx.font = `${Math.floor(rx * 0.75)}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('⭐', x, y - 2);
            }

            ctx.fillStyle = b.corInfo.sombra;
            ctx.beginPath();
            ctx.moveTo(x - 7, y + ry * 0.92); ctx.lineTo(x + 7, y + ry * 0.92);
            ctx.lineTo(x + 10, y + ry * 0.92 + 10); ctx.lineTo(x - 10, y + ry * 0.92 + 10);
            ctx.closePath(); ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)'; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.moveTo(x, y + ry * 0.92 + 10);
            ctx.bezierCurveTo(x + 12, y + ry + 35, x - 12, y + ry + 65, x + 4, y + ry + 95);
            ctx.stroke();
            ctx.restore();
        }

        function desenharIlustracaoAnimal(x, y, tipo, r) {
            ctx.save();
            ctx.translate(x, y);

            if (tipo === 'urso') {
                ctx.fillStyle = '#8B4513';
                ctx.beginPath(); ctx.arc(-r*0.7, -r*0.7, r*0.35, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.7, -r*0.7, r*0.35, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#D2B48C'; ctx.beginPath(); ctx.arc(0, r*0.2, r*0.45, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, r*0.05, r*0.12, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-r*0.35, -r*0.2, r*0.1, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.35, -r*0.2, r*0.1, 0, Math.PI*2); ctx.fill();
            } else if (tipo === 'coelho') {
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.ellipse(-r*0.35, -r*0.9, r*0.2, r*0.6, -0.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(r*0.35, -r*0.9, r*0.2, r*0.6, 0.2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFB6C1';
                ctx.beginPath(); ctx.ellipse(-r*0.35, -r*0.9, r*0.1, r*0.4, -0.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(r*0.35, -r*0.9, r*0.1, r*0.4, 0.2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(255, 182, 193, 0.6)';
                ctx.beginPath(); ctx.arc(-r*0.4, r*0.15, r*0.18, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.4, r*0.15, r*0.18, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#222';
                ctx.beginPath(); ctx.arc(-r*0.3, -r*0.1, r*0.12, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.3, -r*0.1, r*0.12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FF4081'; ctx.beginPath(); ctx.ellipse(0, r*0.08, r*0.1, r*0.06, 0, 0, Math.PI*2); ctx.fill();
            } else if (tipo === 'pintainho') {
                ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FF8C00'; ctx.beginPath(); ctx.moveTo(-r*0.2, r*0.05); ctx.lineTo(r*0.2, r*0.05); ctx.lineTo(0, r*0.35); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-r*0.35, -r*0.15, r*0.11, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.35, -r*0.15, r*0.11, 0, Math.PI*2); ctx.fill();
            } else if (tipo === 'gato') {
                ctx.fillStyle = '#FF9800';
                ctx.beginPath(); ctx.moveTo(-r*0.7, -r*0.3); ctx.lineTo(-r*0.5, -r*1.1); ctx.lineTo(-r*0.1, -r*0.5); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(r*0.7, -r*0.3); ctx.lineTo(r*0.5, -r*1.1); ctx.lineTo(r*0.1, -r*0.5); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-r*0.35, -r*0.15, r*0.11, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.35, -r*0.15, r*0.11, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FF4081'; ctx.beginPath(); ctx.moveTo(-r*0.1, r*0.02); ctx.lineTo(r*0.1, r*0.02); ctx.lineTo(0, r*0.15); ctx.closePath(); ctx.fill();
            } else if (tipo === 'cao') {
                ctx.fillStyle = '#795548';
                ctx.beginPath(); ctx.ellipse(-r*0.8, 0, r*0.3, r*0.6, 0.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(r*0.8, 0, r*0.3, r*0.6, -0.2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#D7CCC8'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, r*0.05, r*0.15, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-r*0.35, -r*0.15, r*0.09, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.35, -r*0.15, r*0.09, 0, Math.PI*2); ctx.fill();
            } else if (tipo === 'vaca') {
                // Vaca: desenho simples, grande e contrastado para funcionar bem no ecrã.
                ctx.fillStyle = '#F5F5F5';
                ctx.beginPath(); ctx.ellipse(0, r*0.05, r*0.92, r*0.78, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#6D4C41';
                ctx.beginPath(); ctx.ellipse(-r*0.42,-r*0.18,r*0.23,r*0.30,-0.35,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(r*0.42,r*0.16,r*0.20,r*0.27,0.35,0,Math.PI*2); ctx.fill();
                // orelhas e chifres
                ctx.fillStyle='#F5F5F5';
                ctx.beginPath(); ctx.ellipse(-r*0.85,-r*0.32,r*0.25,r*0.15,-0.3,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(r*0.85,-r*0.32,r*0.25,r*0.15,0.3,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#FFE082';
                ctx.beginPath(); ctx.moveTo(-r*0.48,-r*0.68); ctx.lineTo(-r*0.62,-r*0.98); ctx.lineTo(-r*0.28,-r*0.78); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(r*0.48,-r*0.68); ctx.lineTo(r*0.62,-r*0.98); ctx.lineTo(r*0.28,-r*0.78); ctx.closePath(); ctx.fill();
                // olhos
                ctx.fillStyle='#263238';
                ctx.beginPath(); ctx.arc(-r*0.33,-r*0.28,r*0.10,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.33,-r*0.28,r*0.10,0,Math.PI*2); ctx.fill();
                // focinho
                ctx.fillStyle='#F48FB1'; ctx.beginPath(); ctx.ellipse(0,r*0.34,r*0.43,r*0.27,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#7E57C2';
                ctx.beginPath(); ctx.arc(-r*0.15,r*0.34,r*0.06,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.15,r*0.34,r*0.06,0,Math.PI*2); ctx.fill();
            } else if (tipo === 'porco') {

                ctx.beginPath(); ctx.arc(r*0.6, -r*0.7, r*0.25, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FF4081'; ctx.beginPath(); ctx.ellipse(0, r*0.1, r*0.35, r*0.25, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-r*0.35, -r*0.15, r*0.09, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(r*0.35, -r*0.15, r*0.09, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        /* =================================================================
           LOOP DE ANIMAÇÃO PRINCIPAL
           ================================================================= */
        function loop(agora) {
            if (!jogoAtual) {
                ctx.clearRect(0, 0, largura, altura);
                requestAnimationFrame(loop);
                return;
            }

            const gFundo = ctx.createLinearGradient(0, 0, 0, altura);
            gFundo.addColorStop(0, '#0f0f1a'); 
            gFundo.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = gFundo; 
            ctx.fillRect(0, 0, largura, altura);

            if (jogoAtual === 'toque') {
                particulasToque.forEach(p => { p.atualizar(); p.desenhar(ctx); });
                particulasToque = particulasToque.filter(p => p.opacidade > 0);
                formasToque.forEach(f => { f.atualizar(); f.desenhar(ctx); });
                formasToque = formasToque.filter(f => f.opacidade > 0);

            } else if (jogoAtual === 'pintura') {
                rastoPintura.forEach(p => { p.atualizar(); p.desenhar(ctx); });
                rastoPintura = rastoPintura.filter(p => p.opacidade > 0);

            } else if (jogoAtual === 'baloes') {
                if (!agora) agora = performance.now();
                let dt = (agora - ultimoTempoBaloes) / 16.667;
                if (isNaN(dt) || dt <= 0) dt = 1;
                if (dt > 3.0) dt = 3.0;
                ultimoTempoBaloes = agora;

                for (let i = particulasBaloes.length - 1; i >= 0; i--) {
                    particulasBaloes[i].atualizar(dt);
                    if (particulasBaloes[i].vida <= 0) particulasBaloes.splice(i, 1);
                    else particulasBaloes[i].desenhar(ctx);
                }

                for (let i = sorpresasBaloes.length - 1; i >= 0; i--) {
                    sorpresasBaloes[i].atualizar(dt);
                    if (sorpresasBaloes[i].opacidade <= 0) sorpresasBaloes.splice(i, 1);
                    else sorpresasBaloes[i].desenhar(ctx);
                }

                baloes.forEach((b, idx) => {
                    b.y -= b.velocidadeY * dt;
                    b.oscilacaoX += b.velocidadeOscilacao * dt;
                    b.currentX = b.xCentro + Math.sin(b.oscilacaoX) * b.amplitudeOscilacao;
                    if (b.y < -b.ry * 2) baloes[idx] = criarNovoBalao(b.coluna);
                });

                for (let i = 0; i < baloes.length; i++) desenharBalao(baloes[i], dt);

                for (let i = baloes.length - 1; i >= 0; i--) {
                    if (baloes[i].morto) {
                        const col = baloes[i].coluna;
                        baloes.splice(i, 1);
                        baloes.push(criarNovoBalao(col));
                    }
                }

            } else if (jogoAtual === 'escondidas') {
                const r = getRaioPortaEscondida();
                atualizarPortasEscondidas(agora);

                ctx.save();
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillStyle='rgba(255,255,255,0.96)';
                ctx.font=`bold ${Math.max(22,Math.min(34,largura*0.028))}px sans-serif`;
                ctx.fillText('Quem está escondido? 👀', largura/2, altura*0.075);
                ctx.font=`${Math.max(15,Math.min(23,largura*0.019))}px sans-serif`;
                ctx.fillStyle='rgba(255,255,255,0.70)';
                ctx.fillText(portaEscondida && portaEscondida.abertura > 0.55 ? 'Olá! 👋' : 'Bate à porta... 🚪', largura/2, altura*0.12);
                ctx.restore();

                // Pequenos brilhos no fundo, para manter a identidade dos outros jogos.
                ctx.save();
                for(let i=0;i<9;i++){
                    const x=largura*(0.06+i*0.11);
                    const y=altura*(0.20 + (i%3)*0.23) + Math.sin(agora*0.0012+i)*8;
                    ctx.globalAlpha=0.22 + (Math.sin(agora*0.002+i)+1)*0.08;
                    ctx.fillStyle = i%2 ? '#7C4DFF' : '#FFD54F';
                    ctx.beginPath(); ctx.arc(x,y,2.5+(i%3),0,Math.PI*2); ctx.fill();
                }
                ctx.restore();

                if (portaEscondida) desenharPortaEscondida(portaEscondida,r,agora);

                for (const e of estrelasDescoberta) {
                    ctx.save(); ctx.globalAlpha=Math.max(0,e.vida); ctx.translate(e.x,e.y); ctx.rotate(e.rot);
                    ctx.fillStyle='#FFD54F'; ctx.shadowBlur=10; ctx.shadowColor='#FFD54F';
                    ctx.beginPath();
                    for(let k=0;k<5;k++){ const a=-Math.PI/2+k*Math.PI*2/5; const rr=k%2===0?e.r:e.r*0.42; const x=Math.cos(a)*rr,y=Math.sin(a)*rr; if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
                    ctx.closePath(); ctx.fill(); ctx.restore();
                }

            } else if (jogoAtual === 'instrumentos') {
                particulasInstrumentos.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.opacidade -= 0.035;
                    ctx.save(); ctx.globalAlpha = Math.max(0, p.opacidade);
                    ctx.fillStyle = p.cor; ctx.shadowBlur = 10; ctx.shadowColor = p.cor;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.raio, 0, Math.PI*2); ctx.fill(); ctx.restore();
                });
                particulasInstrumentos = particulasInstrumentos.filter(p => p.opacidade > 0);
                instrumentos.forEach((inst, i) => {
                    inst.pulso *= 0.86;
                    inst.brilho *= 0.90;
                    desenharInstrumento(inst, i);
                });

                ctx.save();
                ctx.fillStyle = 'rgba(255,255,255,0.82)';
                ctx.font = `bold ${Math.max(18, Math.min(30, largura * 0.025))}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('Toca na música 🎵', largura/2, altura * 0.055);
                ctx.restore();

            } else if (jogoAtual === 'aquario') {
                desenharAquarioFundo();
                for (const b of bolhasAquario) {
                    b.x += b.vx; b.y += b.vy; b.opacidade -= 0.0015;
                    if (b.y < altura*0.08) { b.y=altura*0.96; b.opacidade=0.32; }
                    ctx.save(); ctx.globalAlpha=Math.max(0.08,Math.min(0.75,b.opacidade)); ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2;
                    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke(); ctx.restore();
                }
                peixesAquario.forEach((peixe,i)=>{
                    peixe.x += peixe.vx * multiplicadorRitmo;
                    peixe.y += Math.sin(agora*0.0012 + peixe.fase)*0.28;
                    if(peixe.x < -peixe.r*2) peixe.x=largura+peixe.r*2;
                    if(peixe.x > largura+peixe.r*2) peixe.x=-peixe.r*2;
                    peixe.brilho *= 0.90; peixe.cauda *= 0.88;
                    desenharPeixeAquario(peixe,agora);
                });
                for(let i=ondasAquario.length-1;i>=0;i--){
                    const o=ondasAquario[i]; o.r += 2.8; o.opacidade -= 0.035;
                    ctx.save(); ctx.globalAlpha=Math.max(0,o.opacidade); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.stroke(); ctx.restore();
                    if(o.opacidade<=0) ondasAquario.splice(i,1);
                }

            } else if (jogoAtual === 'encaixe') {
                encaixes.forEach(en => {
                    desenharFormaGenerica(ctx, en.x, en.y, en.tamanho, en.tipo, null, true);
                });

                if (pecaPaiEncaixe) {
                    desenharFormaGenerica(ctx, pecaPaiEncaixe.x, pecaPaiEncaixe.y, pecaPaiEncaixe.tamanho, pecaPaiEncaixe.tipo, pecaPaiEncaixe.cor, false);
                }

                particulasEncaixe.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.opacidade -= 0.02;
                    ctx.save();
                    ctx.globalAlpha = Math.max(p.opacidade, 0);
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
                    ctx.fillStyle = p.cor; ctx.shadowBlur = 10; ctx.shadowColor = p.cor;
                    ctx.fill(); ctx.restore();
                });
                particulasEncaixe = particulasEncaixe.filter(p => p.opacidade > 0);
            }

            requestAnimationFrame(loop);
        }

        redimensionar();
        requestAnimationFrame(loop);
    </script>
</body>
