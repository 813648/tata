        /* =================================================================
           LOOP DE ANIMAÇÃO PRINCIPAL
           ================================================================= */
        function loop(agora) {
            if (!jogoAtual) {
                ctx.clearRect(0, 0, largura, altura);
                requestAnimationFrame(loop);
                return;
            }

            const gFundo = ctx.createLinearGradient(0, 0, 0, altura);
            gFundo.addColorStop(0, '#0f0f1a'); 
            gFundo.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = gFundo; 
            ctx.fillRect(0, 0, largura, altura);

            if (jogoAtual === 'toque') {
                particulasToque.forEach(p => { p.atualizar(); p.desenhar(ctx); });
                particulasToque = particulasToque.filter(p => p.opacidade > 0);
                formasToque.forEach(f => { f.atualizar(); f.desenhar(ctx); });
                formasToque = formasToque.filter(f => f.opacidade > 0);

            } else if (jogoAtual === 'pintura') {
                rastoPintura.forEach(p => { p.atualizar(); p.desenhar(ctx); });
                rastoPintura = rastoPintura.filter(p => p.opacidade > 0);

            } else if (jogoAtual === 'baloes') {
                if (!agora) agora = performance.now();
                let dt = (agora - ultimoTempoBaloes) / 16.667;
                if (isNaN(dt) || dt <= 0) dt = 1;
                if (dt > 3.0) dt = 3.0;
                ultimoTempoBaloes = agora;

                for (let i = particulasBaloes.length - 1; i >= 0; i--) {
                    particulasBaloes[i].atualizar(dt);
                    if (particulasBaloes[i].vida <= 0) particulasBaloes.splice(i, 1);
                    else particulasBaloes[i].desenhar(ctx);
                }

                for (let i = sorpresasBaloes.length - 1; i >= 0; i--) {
                    sorpresasBaloes[i].atualizar(dt);
                    if (sorpresasBaloes[i].opacidade <= 0) sorpresasBaloes.splice(i, 1);
                    else sorpresasBaloes[i].desenhar(ctx);
                }

                baloes.forEach((b, idx) => {
                    b.y -= b.velocidadeY * dt;
                    b.oscilacaoX += b.velocidadeOscilacao * dt;
                    b.currentX = b.xCentro + Math.sin(b.oscilacaoX) * b.amplitudeOscilacao;
                    if (b.y < -b.ry * 2) baloes[idx] = criarNovoBalao(b.coluna);
                });

                for (let i = 0; i < baloes.length; i++) desenharBalao(baloes[i], dt);

                for (let i = baloes.length - 1; i >= 0; i--) {
                    if (baloes[i].morto) {
                        const col = baloes[i].coluna;
                        baloes.splice(i, 1);
                        baloes.push(criarNovoBalao(col));
                    }
                }

            } else if (jogoAtual === 'escondidas') {
                const r = getRaioPortaEscondida();
                atualizarPortasEscondidas(agora);

                desenharFundoCeleiroEscondidas(agora);
                portasEscondidas.forEach(porta => desenharPortaEscondida(porta,r,agora));

                for (const e of estrelasDescoberta) {
                    ctx.save(); ctx.globalAlpha=Math.max(0,e.vida); ctx.translate(e.x,e.y); ctx.rotate(e.rot);
                    ctx.fillStyle='#FFD54F'; ctx.shadowBlur=10; ctx.shadowColor='#FFD54F';
                    ctx.beginPath();
                    for(let k=0;k<5;k++){ const a=-Math.PI/2+k*Math.PI*2/5; const rr=k%2===0?e.r:e.r*0.42; const x=Math.cos(a)*rr,y=Math.sin(a)*rr; if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
                    ctx.closePath(); ctx.fill(); ctx.restore();
                }

            } else if (jogoAtual === 'piano') {
                // O piano é desenhado aqui; a deteção do toque pertence ao handler de toque.
                teclasPiano.forEach(t => {
                    t.pressionada *= 0.88;
                    if (t.pressionada < 0.02) t.pressionada = 0;
                });
                for (let i = notasPianoAtivas.length - 1; i >= 0; i--) {
                    const n = notasPianoAtivas[i];
                    n.x += Math.sin((1-n.vida)*8 + i) * 0.35;
                    n.y += n.vy;
                    n.vida -= 0.018;
                    if (n.vida <= 0) notasPianoAtivas.splice(i,1);
                }
                desenharPiano();
            } else if (jogoAtual === 'instrumentos') {
                particulasInstrumentos.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.opacidade -= 0.035;
                    ctx.save(); ctx.globalAlpha = Math.max(0, p.opacidade);
                    ctx.fillStyle = p.cor; ctx.shadowBlur = 10; ctx.shadowColor = p.cor;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.raio, 0, Math.PI*2); ctx.fill(); ctx.restore();
                });
                particulasInstrumentos = particulasInstrumentos.filter(p => p.opacidade > 0);
                instrumentos.forEach((inst, i) => {
                    inst.pulso *= 0.86;
                    inst.brilho *= 0.90;
                    desenharInstrumento(inst, i);
                });

            } else if (jogoAtual === 'aquario') {
                desenharAquarioFundo(agora);
                for(let i=bolhasAquario.length-1;i>=0;i--){
                    const b=bolhasAquario[i];
                    b.x+=b.vx; b.y+=b.vy;
                    if(b.temporaria){
                        b.vida-=1;
                        if(b.vida<55) b.opacidade=Math.min(b.opacidade,(b.vida/55)*.85);
                        if(b.vida<=0){bolhasAquario.splice(i,1);continue;}
                    } else if(b.y<altura*.07){
                        b.y=altura*.97;b.x=Math.random()*largura;b.opacidade=.25;
                    }
                    ctx.save();ctx.globalAlpha=Math.max(.02,Math.min(.72,b.opacidade));ctx.strokeStyle='rgba(255,255,255,.82)';ctx.lineWidth=Math.max(1.5,b.r*.12);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(b.x-b.r*.28,b.y-b.r*.28,b.r*.18,0,Math.PI*2);ctx.fill();ctx.restore();
                }
                peixesAquario.forEach(peixe=>{
                    peixe.x+=peixe.vx*largura*multiplicadorRitmo; peixe.y+=Math.sin(agora*.0012+peixe.fase)*baseAquario()*.00045;
                    if(peixe.x < -peixe.r*2.0) peixe.x=largura+peixe.r*2.0;
                    if(peixe.x > largura+peixe.r*2.0) peixe.x=-peixe.r*2.0;
                    peixe.brilho*=.90;peixe.cauda*=.88;desenharPeixeAquario(peixe,agora);
                });
                criaturasAquario.forEach(c=>{
                    c.brilho*=.90;c.pulo*=.86;c.entrada*=.92;
                    if(c.pulo<.01)c.pulo=0;
                    if(!c.ativa)return;
                    c.y+=c.vy*altura*multiplicadorRitmo;
                    const limiteTopo=altura*.10+c.r*.35, limiteFundo=altura*.73-c.r*.8;
                    // Ao chegar ao topo, a criatura sai do aquário e fica novamente escondida.
                    if(c.y<limiteTopo){
                        c.ativa=false;
                        c.entrada=0;
                        c.pulo=0;
                        c.brilho=0;
                        return;
                    }
                    if(c.y>limiteFundo){c.y=limiteFundo;c.vy=-Math.abs(c.vy);c.espelho*=-1;}
                    if(c.tipo==='medusa')desenharMedusaAquario(c,agora);else desenharCavaloAquario(c,agora);
                });
                for(let i=brilhosAquario.length-1;i>=0;i--){const b=brilhosAquario[i];b.x+=b.vx*largura;b.y+=b.vy*largura;b.vx*=.96;b.vy*=.96;b.vida-=.035;ctx.save();ctx.globalAlpha=Math.max(0,b.vida);ctx.fillStyle=b.cor;ctx.shadowBlur=10;ctx.shadowColor=b.cor;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();if(b.vida<=0)brilhosAquario.splice(i,1);}
                for(let i=ondasAquario.length-1;i>=0;i--){const o=ondasAquario[i];o.r+=2.8;o.opacidade-=.035;ctx.save();ctx.globalAlpha=Math.max(0,o.opacidade);ctx.strokeStyle='#FFF';ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.stroke();ctx.restore();if(o.opacidade<=0)ondasAquario.splice(i,1);}

            } else if (jogoAtual === 'encaixe') {
                encaixes.forEach(en => {
                    desenharFormaGenerica(ctx, en.x, en.y, en.tamanho, en.tipo, null, true);
                });

                if (pecaPaiEncaixe) {
                    desenharFormaGenerica(ctx, pecaPaiEncaixe.x, pecaPaiEncaixe.y, pecaPaiEncaixe.tamanho, pecaPaiEncaixe.tipo, pecaPaiEncaixe.cor, false);
                }

                particulasEncaixe.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.opacidade -= 0.02;
                    ctx.save();
                    ctx.globalAlpha = Math.max(p.opacidade, 0);
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
                    ctx.fillStyle = p.cor; ctx.shadowBlur = 10; ctx.shadowColor = p.cor;
                    ctx.fill(); ctx.restore();
                });
                particulasEncaixe = particulasEncaixe.filter(p => p.opacidade > 0);
            }

            desenharTituloJogo();
            requestAnimationFrame(loop);
        }

        redimensionar();
        requestAnimationFrame(loop);
    </script>
