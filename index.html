<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️ Portal Mágico da Tatá ⭐️</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f1a">

	<link rel="apple-touch-icon" href="icone.svg">
    <link rel="icon" type="image/svg+xml" href="icone.svg">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            touch-action: none;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
		/* ADICIONAR ESTAS LINHAS: */
		overscroll-behavior: none; /* Desativa o "puxar para atualizar" e o ressalto do navegador */
		-webkit-touch-callout: none; /* Evita que apareçam menus ao manter o dedo premido no iOS */
		-webkit-user-select: none; /* Garante que não seleciona texto acidentalmente */
		user-select: none;	
			
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Botão Voltar ao Portal (Apenas a casinha) */
        #btnVoltar {
            position: absolute;
            top: 15px;
            right: 15px; /* Canto superior direito */
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.15s, background 0.15s;
        }

        #btnVoltar:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Ecrã Inicial / Hub */
        #portalHome {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }

        .titulo-portal {
            font-size: 42px;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4), 2px 3px 6px rgba(0,0,0,0.6);
            margin-bottom: 35px;
            text-align: center;
        }

        .painel-ritmo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 45px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 28px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .label-ritmo {
            font-size: 16px;
            font-weight: bold;
            color: #E0E0FF;
            margin-bottom: 10px;
        }

        .botoes-ritmo {
            display: flex;
            gap: 10px;
        }

        .btn-ritmo {
            padding: 8px 16px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            color: #E0E0FF;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ritmo.ativo {
            background: #FF9F1A;
            color: white;
            border-color: #FFD700;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 159, 26, 0.6);
        }

        /* Grelha das Apps */
        .grid-apps {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            max-width: 900px;
            width: 100%;
        }

        .card-app {
            width: 130px;
            height: 125px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(6px);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            text-align: center;
        }

        .card-app:active {
            transform: scale(0.93);
        }

        .card-app.toque { border-color: #3380FF; box-shadow: 0 4px 15px rgba(51, 128, 255, 0.25); }
        .card-app.pintura { border-color: #FFE680; box-shadow: 0 4px 15px rgba(255, 230, 128, 0.25); }
        .card-app.baloes { border-color: #A3E9C4; box-shadow: 0 4px 15px rgba(163, 233, 196, 0.25); }
        .card-app.escondidas { border-color: #DCB3FF; box-shadow: 0 4px 15px rgba(220, 179, 255, 0.25); }
        .card-app.encaixe { border-color: #FF9F1A; box-shadow: 0 4px 15px rgba(255, 159, 26, 0.25); }
        .card-app.instrumentos { border-color: #C084FC; box-shadow: 0 4px 15px rgba(192, 132, 252, 0.25); }
        .card-app.aquario { border-color: #4DD0E1; box-shadow: 0 4px 15px rgba(77, 208, 225, 0.25); }
        .card-app.piano { border-color: #FFD54F; box-shadow: 0 4px 15px rgba(255, 213, 79, 0.25); }

        .card-app .icon {
            font-size: 40px;
            margin-bottom: 6px;
            line-height: 1;
        }

        .card-app .nome {
            font-size: 13px;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <button id="btnVoltar">🏠</button>

    <div id="portalHome">
        <div class="titulo-portal">⭐️ Portal Mágico da Tatá ⭐️</div>

        <div class="painel-ritmo">
            <div class="label-ritmo">Ritmo do Jogo:</div>
            <div class="botoes-ritmo">
                <button class="btn-ritmo" data-multiplicador="0.6">Lento 🐢</button>
                <button class="btn-ritmo ativo" data-multiplicador="1.0">Normal 🎈</button>
                <button class="btn-ritmo" data-multiplicador="1.5">Rápido 🚀</button>
            </div>
        </div>

        <div class="grid-apps">
            <div class="card-app toque" onclick="abrirJogo('toque')">
                <div class="icon">✨</div>
                <div class="nome">Toque Mágico</div>
            </div>
            <div class="card-app pintura" onclick="abrirJogo('pintura')">
                <div class="icon">🎨</div>
                <div class="nome">Pintura Mágica</div>
            </div>
            <div class="card-app baloes" onclick="abrirJogo('baloes')">
                <div class="icon">🎈</div>
                <div class="nome">Balões Mágicos</div>
            </div>
            <div class="card-app escondidas" onclick="abrirJogo('escondidas')">
                <div class="icon">🙈</div>
                <div class="nome">Escondidas Mágicas</div>
            </div>
            <div class="card-app encaixe" onclick="abrirJogo('encaixe')">
                <div class="icon">🧩</div>
                <div class="nome">Encaixe Mágico</div>
            </div>
            <div class="card-app instrumentos" onclick="abrirJogo('instrumentos')">
                <div class="icon">🎵</div>
                <div class="nome">Instrumentos Mágicos</div>
            </div>
            <div class="card-app aquario" onclick="abrirJogo('aquario')">
                <div class="icon">🐠</div>
                <div class="nome">Aquário Mágico</div>
            </div>
            <div class="card-app piano" onclick="abrirJogo('piano')">
                <div class="icon">🎹</div>
                <div class="nome">Piano Mágico</div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const portalHome = document.getElementById('portalHome');
        const btnVoltar = document.getElementById('btnVoltar');
        const botoesRitmo = document.querySelectorAll('.btn-ritmo');

        let audioCtx;
        let jogoAtual = null; 
        let multiplicadorRitmo = 1.0;
        let largura, altura;

        botoesRitmo.forEach(btn => {
            btn.addEventListener('click', () => {
                botoesRitmo.forEach(b => b.classList.remove('ativo'));
                btn.classList.add('ativo');
                multiplicadorRitmo = parseFloat(btn.getAttribute('data-multiplicador'));
            });
        });

        function redimensionar() {
            largura = canvas.width = window.innerWidth;
            altura = canvas.height = window.innerHeight;
            if (jogoAtual === 'escondidas') reconfigurarEsconderijos();
            if (jogoAtual === 'encaixe') reconfigurarEncaixes();
            if (jogoAtual === 'instrumentos') reconfigurarInstrumentos();
            if (jogoAtual === 'aquario') reconfigurarAquario();
            if (jogoAtual === 'piano') reconfigurarPiano();
        }
        window.addEventListener('resize', redimensionar);

        function iniciarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function abrirJogo(nomeJogo) {
            iniciarAudio();
            jogoAtual = nomeJogo;
            portalHome.style.display = 'none';
            btnVoltar.style.display = 'flex';

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            redimensionar();
            iniciarEstadoJogo(nomeJogo);
        }

        btnVoltar.addEventListener('click', () => {
            jogoAtual = null;
            portalHome.style.display = 'flex';
            btnVoltar.style.display = 'none';
        });

        /* =================================================================
           SISTEMA DE SOM GERAL E NOTAS (Motor Sintetizador Atualizado)
           ================================================================= */
        const NOTAS_GERAIS = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
        
        function tocarNotaMusical() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const freq = NOTAS_GERAIS[Math.floor(Math.random() * NOTAS_GERAIS.length)];
            const agora = audioCtx.currentTime + 0.02;
            
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, agora);
            gain.gain.linearRampToValueAtTime(0.15, agora + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, agora + 1.0);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(agora);
            osc.stop(agora + 1.0);
        }

        function tocarSomPop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const agora = audioCtx.currentTime + 0.02;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(550, agora);
            osc.frequency.exponentialRampToValueAtTime(120, agora + 0.09);
            gain.gain.setValueAtTime(0.35, agora);
            gain.gain.linearRampToValueAtTime(0, agora + 0.09);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(agora); osc.stop(agora + 0.09);
        }

        function tocarSomMagico() {
            if (!audioCtx) return;
            const notas = [523.25, 659.25, 783.99, 1046.50];
            const agora = audioCtx.currentTime + 0.02;
            notas.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const inicio = agora + (index * 0.07);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, inicio);
                gain.gain.setValueAtTime(0.25, inicio);
                gain.gain.exponentialRampToValueAtTime(0.001, inicio + 0.35);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(inicio); osc.stop(inicio + 0.35);
            });
        }

        function tocarSomVitoriaEncaixe() {
            if (!audioCtx) return;
            const notasFesta = [329.63, 392.00, 523.25, 659.25];
            const agora = audioCtx.currentTime + 0.02;
            notasFesta.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const inicio = agora + (index * 0.12);
                gain.gain.setValueAtTime(0, inicio);
                gain.gain.linearRampToValueAtTime(0.2, inicio + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, inicio + 0.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(inicio); osc.stop(inicio + 0.8);
            });
        }

        // Sons locais: prefere MP3 e, se não existir, usa OGG.
        // Assim podes substituir um som apenas copiando, por exemplo,
        // audio/gato.mp3 sem alterar o JavaScript.
        const audioAnimais = {};
        let audioAnimalAtual = null;

        function tocarSomAnimal(tipo) {
            const nomeFicheiro = tipo === 'porco' ? 'porquinho' : tipo;

            if (audioAnimalAtual) {
                try { audioAnimalAtual.pause(); audioAnimalAtual.currentTime = 0; } catch (_) {}
            }

            const tocar = (extensao, tentarFallback) => {
                const chave = `${nomeFicheiro}.${extensao}`;
                let audio = audioAnimais[chave];
                if (!audio) {
                    audio = new Audio(`audio/${chave}`);
                    audio.preload = 'auto';
                    audio.volume = 0.88;
                    audioAnimais[chave] = audio;
                }
                audio.onerror = () => {
                    audio.onerror = null;
                    if (tentarFallback) tocar('ogg', false);
                };
                audio.currentTime = 0;
                audioAnimalAtual = audio;
                const promessa = audio.play();
                if (promessa && promessa.catch) {
                    promessa.catch(() => { if (tentarFallback) tocar('ogg', false); });
                }
            };

            tocar('mp3', true);
        }

        /* =================================================================
           ESTADOS & VARIÁVEIS DOS JOGOS
           ================================================================= */
        let formasToque = [];
        let particulasToque = [];
        const CORES_TOQUE = ['#FF5733', '#FFC300', '#DAF7A6', '#33FFBD', '#3380FF', '#9D33FF', '#FF33A8'];

        let rastoPintura = [];
        let matizPintura = 0;
        let ultimoSomPintura = 0;

        let baloes = [];
        let particulasBaloes = [];
        let sorpresasBaloes = [];
        let contadorSemEspecial = 0;
        let ultimoTempoBaloes = 0;
        const MAX_BALOES = 5;
        const PALETA_BALOES = [
            { nome: 'vermelho', base: '#FF2D55', luz: '#FFA3B5', sombra: '#99001A' },
            { nome: 'azul',     base: '#2E86DE', luz: '#A0CBF8', sombra: '#104F8B' },
            { nome: 'verde',    base: '#10AC84', luz: '#8CE2CB', sombra: '#065A44' },
            { nome: 'amarelo',  base: '#FF9F1A', luz: '#FFDEAA', sombra: '#B36200' },
            { nome: 'roxo',     base: '#9C27B0', luz: '#E1BEE7', sombra: '#4A148C' },
            { nome: 'laranja',  base: '#FF5722', luz: '#FFAB91', sombra: '#BF360C' },
            { nome: 'rosa',     base: '#E91E63', luz: '#F8BBD0', sombra: '#880E4F' },
            { nome: 'ciano',    base: '#00BCD4', luz: '#B2EBF2', sombra: '#006064' }
        ];
        const EMOJIS_SURPRESA = ['🦢', '🐬', '🤹', '🧸', '🚕', '🌼', '🐤', '🏡', '🍓', '🌻', '🥕', '🌻', '🥣', '🍼', '🍊'];

        let esconderijos = [];
        const CATALOGO_ANIMAIS = {
            urso:      { nome: 'urso',      corNuvem: '#A1887F' },
            coelho:    { nome: 'coelho',    corNuvem: '#F8BBD0' }, 
            pintainho: { nome: 'pintainho', corNuvem: '#FFF176' },
            gato:      { nome: 'gato',      corNuvem: '#FFB74D' },
            cao:       { nome: 'cao',       corNuvem: '#D7CCC8' },
            porco:     { nome: 'porco',     corNuvem: '#F48FB1' }
        };

        let pecaPaiEncaixe = null;
        let encaixes = [];
        let particulasEncaixe = [];
        let emTransicaoEncaixe = false;

        let instrumentos = [];
        let teclasPiano = [];
        let notasPianoAtivas = [];
        let instrumentoPianoAtual = 'Órgão';
        let botoesInstrumentoPiano = [];
        const INSTRUMENTOS_PIANO = [
            {nome:'Órgão', tipo:'orgao', simbolo:'🎹'},
            {nome:'Bass', tipo:'bass', simbolo:'🎸'},
            {nome:'Steel Drum', tipo:'steel', simbolo:'🥁'},
            {nome:'Tub Bells', tipo:'bells', simbolo:'🔔'},
            {nome:'Guitar', tipo:'guitar', simbolo:'🎸'},
            {nome:'Marimba', tipo:'marimba', simbolo:'🪵'},
            {nome:'Vibraphone', tipo:'vibra', simbolo:'✨'},
            {nome:'Piano', tipo:'piano', simbolo:'🎼'}
        ];
        const NOTAS_PIANO = [
            {nome:'Dó',freq:261.63,branca:true,glyph:'♩'}, {nome:'Ré',freq:293.66,branca:true,glyph:'♪'},
            {nome:'Mi',freq:329.63,branca:true,glyph:'♫'}, {nome:'Fá',freq:349.23,branca:true,glyph:'♩'},
            {nome:'Sol',freq:392.00,branca:true,glyph:'♪'}, {nome:'Lá',freq:440.00,branca:true,glyph:'♫'},
            {nome:'Si',freq:493.88,branca:true,glyph:'♩'},
            {nome:'Dó♯',freq:277.18,branca:false,glyph:'♪'}, {nome:'Ré♯',freq:311.13,branca:false,glyph:'♫'},
            {nome:'Fá♯',freq:369.99,branca:false,glyph:'♪'}, {nome:'Sol♯',freq:415.30,branca:false,glyph:'♫'},
            {nome:'Lá♯',freq:466.16,branca:false,glyph:'♪'}
        ];
        let particulasInstrumentos = [];
        let toquesInstrumentos = [];
        let ultimoInstrumento = -1;
        const TIPOS_FORMAS = ['circulo', 'quadrado', 'triangulo', 'estrela'];
        const CORES_ENCAIXE = ['#FF5733', '#FFC300', '#33FFBD', '#3380FF', '#9D33FF', '#FF33A8'];

        let peixesAquario = [];
        let bolhasAquario = [];
        let ondasAquario = [];
        let plantasAquario = [];
        const CORES_PEIXES = ['#FF8A65', '#FFD54F', '#64B5F6', '#BA68C8', '#81C784'];


        function iniciarEstadoJogo(nome) {
            if (nome === 'toque') {
                formasToque = [];
                particulasToque = [];
            } else if (nome === 'pintura') {
                rastoPintura = [];
                matizPintura = 0;
            } else if (nome === 'baloes') {
                baloes = [];
                particulasBaloes = [];
                sorpresasBaloes = [];
                contadorSemEspecial = 0;
                let raioBase = Math.min(largura, altura) * 0.10;
                for (let i = 0; i < MAX_BALOES; i++) {
                    baloes.push(criarNovoBalao(i, true, raioBase));
                }
                ultimoTempoBaloes = performance.now();
            } else if (nome === 'escondidas') {
                estrelasDescoberta = [];
                reconfigurarEsconderijos();
            } else if (nome === 'encaixe') {
                iniciarNovaSequenciaEncaixe();
            } else if (nome === 'instrumentos') {
                particulasInstrumentos = [];
                reconfigurarInstrumentos();
            } else if (nome === 'aquario') {
                reconfigurarAquario();
            } else if (nome === 'piano') {
                reconfigurarPiano();
            }
        }

        function criarNovoBalao(colunaIndex, inicio = false, raioBase) {
            const larguraColuna = largura / MAX_BALOES;
            const rx = (raioBase || Math.min(largura, altura) * 0.10) * (0.85 + Math.random() * 0.2);
            const ry = rx * 1.3;
            const xCentro = (colunaIndex + 0.5) * larguraColuna;
            const amplitudeMax = (larguraColuna / 2) - rx - 5;
            const amplitudeOscilacao = Math.max(5, Math.min(amplitudeMax, 15));

            let y = inicio 
                ? altura + ry + (colunaIndex * (altura / MAX_BALOES) * 0.7)
                : altura + ry + (Math.random() * 100);

            const especiaisNoEcra = baloes.filter(b => b.especial && !b.morto).length;
            let eEspecial = false;
            
            if (especiaisNoEcra < 2 && contadorSemEspecial >= 2) {
                eEspecial = true;
                contadorSemEspecial = 0;
            } else {
                contadorSemEspecial++;
            }

            return {
                coluna: colunaIndex,
                rx: rx, ry: ry,
                xCentro: xCentro, y: y, currentX: xCentro,
                velocidadeY: (1.2 + Math.random() * 1.1) * multiplicadorRitmo,
                oscilacaoX: Math.random() * Math.PI * 2,
                velocidadeOscilacao: (0.018 + Math.random() * 0.012) * multiplicadorRitmo,
                amplitudeOscilacao: amplitudeOscilacao,
                corInfo: PALETA_BALOES[Math.floor(Math.random() * PALETA_BALOES.length)],
                especial: eEspecial, tempoVida: Math.random() * 100, morto: false
            };
        }

        /* =================================================================
           LÓGICA: QUEM ESTÁ ESCONDIDO? — TEATRO DAS PORTAS MÁGICAS
           Cada porta esconde um animal. As pistas aparecem antes da
           descoberta: olhos/orelhas espreitam, a porta abre, o animal
           salta para fora e depois muda para outro animal.
           ================================================================= */
        // Animais em PNG local: podes substituir qualquer imagem sem alterar o jogo.
        const ANIMAIS_ESCONDIDOS = [
            { tipo:'urso',    nome:'Urso',       cor:'#9C6B4F', imagem:'assets/animais/urso.png' },
            { tipo:'vaca',    nome:'Vaca',       cor:'#66BB6A', imagem:'assets/animais/vaca.png' },
            { tipo:'gato',    nome:'Gato',       cor:'#FF9F43', imagem:'assets/animais/gato.png' },
            { tipo:'cao',     nome:'Cão',        cor:'#42A5F5', imagem:'assets/animais/cao.png' },
            { tipo:'porco',  nome:'Porquinho',  cor:'#EC6FA8', imagem:'assets/animais/porquinho.png' },
            { tipo:'ovelha', nome:'Ovelha',      cor:'#B8C8D8', imagem:'assets/animais/ovelha.png' },
            { tipo:'cavalo', nome:'Cavalo',      cor:'#B56B3A', imagem:'assets/animais/cavalo.png' },
            { tipo:'galo',   nome:'Galo',        cor:'#E74C3C', imagem:'assets/animais/galo.png' },
            { tipo:'pato',   nome:'Pato',        cor:'#F4B400', imagem:'assets/animais/pato.png' }
        ];
        const IMAGENS_ANIMAIS_ESCONDIDOS = {};
        ANIMAIS_ESCONDIDOS.forEach(animal => {
            const img = new Image();
            img.src = animal.imagem;
            IMAGENS_ANIMAIS_ESCONDIDOS[animal.tipo] = img;
        });
        let portasEscondidas = [];
        let estrelasDescoberta = [];
        let ultimoEventoEscondido = 0;

        function getRaioPortaEscondida() {
            return altura > largura
                ? Math.min(largura * 0.30, altura * 0.16)
                : Math.min(largura * 0.14, altura * 0.22);
        }

        function escolherAnimalDiferente(excepto) {
            const opcoes = ANIMAIS_ESCONDIDOS.filter(a => a.tipo !== excepto);
            return opcoes[Math.floor(Math.random() * opcoes.length)] || ANIMAIS_ESCONDIDOS[0];
        }

        function escolherAnimaisIniciaisEscondidos() {
            const baralho = [...ANIMAIS_ESCONDIDOS];
            for (let i = baralho.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [baralho[i], baralho[j]] = [baralho[j], baralho[i]];
            }
            return baralho.slice(0, 3);
        }

        function escolherAnimalParaPorta(portaIndex, exceptoTipo) {
            const usados = portasEscondidas
                .map((p, i) => i === portaIndex ? null : p.animal && p.animal.tipo)
                .filter(Boolean);
            const opcoes = ANIMAIS_ESCONDIDOS.filter(a => a.tipo !== exceptoTipo && !usados.includes(a.tipo));
            const reserva = ANIMAIS_ESCONDIDOS.filter(a => a.tipo !== exceptoTipo);
            return (opcoes.length ? opcoes : reserva)[Math.floor(Math.random() * (opcoes.length ? opcoes.length : reserva.length))];
        }

        function reconfigurarEsconderijos() {
            const r = getRaioPortaEscondida();
            const portrait = altura > largura;
            const pos = portrait
                ? [{x:largura*0.50,y:altura*0.27},{x:largura*0.50,y:altura*0.53},{x:largura*0.50,y:altura*0.79}]
                : [{x:largura*0.20,y:altura*0.58},{x:largura*0.50,y:altura*0.58},{x:largura*0.80,y:altura*0.58}];

            const anteriores = portasEscondidas;
            const novos = anteriores.length ? anteriores.map(p => p.animal) : escolherAnimaisIniciaisEscondidos();
            portasEscondidas = pos.map((pt,i) => {
                const animal = novos[i] || ANIMAIS_ESCONDIDOS[i];
                return {
                    x:pt.x, y:pt.y, animal,
                    aberta:false, abertura:0, salto:0, brilho:0,
                    tempoFecho:0, proximoAnimal:0,
                    fase:Math.random()*Math.PI*2,
                    piscou:false
                };
            });
        }

        function abrirPortaEscondida(porta) {
            if (porta.aberta) return;
            iniciarAudio();
            porta.aberta = true;
            porta.tempoFecho = performance.now() + 2500;
            porta.salto = 1;
            porta.brilho = 1;
            tocarSomAnimal(porta.animal.tipo);

            const r = getRaioPortaEscondida();
            for (let i=0;i<18;i++) {
                const ang = Math.random()*Math.PI*2;
                const vel = 1.2 + Math.random()*2.8;
                estrelasDescoberta.push({
                    x:porta.x, y:porta.y-r*0.15,
                    vx:Math.cos(ang)*vel, vy:Math.sin(ang)*vel-1.5,
                    r:3+Math.random()*6, vida:1, rot:Math.random()*6
                });
            }
        }

        function atualizarPortasEscondidas(agora) {
            if (!portasEscondidas.length) reconfigurarEsconderijos();
            portasEscondidas.forEach(porta => {
                if (porta.aberta && agora >= porta.tempoFecho) {
                    porta.aberta = false;
                    porta.proximoAnimal = agora + 500;
                }
                if (!porta.aberta && porta.proximoAnimal && agora >= porta.proximoAnimal) {
                    const novo = escolherAnimalParaPorta(portasEscondidas.indexOf(porta), porta.animal.tipo);
                    porta.animal = novo;
                    porta.proximoAnimal = 0;
                    porta.piscou = false;
                }
                const alvo = porta.aberta ? 1 : 0;
                porta.abertura += (alvo - porta.abertura) * 0.16;
                if (porta.salto > 0) {
                    porta.salto *= 0.84;
                    if (porta.salto < 0.02) porta.salto = 0;
                }
                porta.brilho *= 0.91;
            });

            for (let i=estrelasDescoberta.length-1;i>=0;i--) {
                const e=estrelasDescoberta[i];
                e.x+=e.vx; e.y+=e.vy; e.vy+=0.08; e.vx*=0.99; e.vida-=0.025; e.rot+=0.12;
                if(e.vida<=0) estrelasDescoberta.splice(i,1);
            }
        }

        function desenharFundoCeleiroEscondidas(agora){
            // Enquadramento simples de celeiro: serve apenas de palco para as 3 portas.
            // O título e as portas continuam a ser desenhados pelo jogo, sem alterações.
            const grad=ctx.createLinearGradient(0,0,0,altura);
            grad.addColorStop(0,'#8B5A35');
            grad.addColorStop(.58,'#9A633A');
            grad.addColorStop(1,'#6E452A');
            ctx.fillStyle=grad; ctx.fillRect(0,0,largura,altura);

            // Tábuas verticais do celeiro.
            ctx.save();
            ctx.globalAlpha=.34;
            ctx.strokeStyle='#4E301E';
            ctx.lineWidth=Math.max(2,largura*.0022);
            const passo=Math.max(32,largura*.045);
            for(let x=0;x<largura;x+=passo){
                ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,altura*.82);ctx.stroke();
            }
            ctx.restore();

            // Travessas de madeira, discretas e fora da zona principal das portas.
            ctx.save();
            ctx.fillStyle='rgba(63,38,24,.62)';
            ctx.fillRect(0,altura*.20,largura,Math.max(10,altura*.018));
            ctx.fillRect(0,altura*.83,largura,Math.max(12,altura*.022));
            ctx.restore();

            // Estrutura superior do telhado.
            ctx.save();
            ctx.strokeStyle='rgba(61,37,24,.85)';
            ctx.lineWidth=Math.max(10,largura*.012);
            ctx.beginPath();ctx.moveTo(0,altura*.15);ctx.lineTo(largura*.18,0);ctx.stroke();
            ctx.beginPath();ctx.moveTo(largura,altura*.15);ctx.lineTo(largura*.82,0);ctx.stroke();
            ctx.restore();

            // Pequena luz quente no centro superior.
            const lx=largura*.5, ly=altura*.20;
            ctx.save();
            ctx.shadowBlur=28;ctx.shadowColor='rgba(255,220,130,.45)';
            ctx.fillStyle='#FFE7A3';ctx.beginPath();ctx.arc(lx,ly,Math.max(6,altura*.012),0,Math.PI*2);ctx.fill();
            ctx.shadowBlur=0;ctx.strokeStyle='rgba(55,35,24,.8)';ctx.lineWidth=Math.max(3,altura*.004);
            ctx.beginPath();ctx.moveTo(lx,ly-altura*.035);ctx.lineTo(lx,ly-altura*.012);ctx.stroke();
            ctx.beginPath();ctx.arc(lx,ly,Math.max(10,altura*.02),Math.PI,0);ctx.stroke();
            ctx.restore();

            // Chão de madeira.
            ctx.save();
            const chao=ctx.createLinearGradient(0,altura*.83,0,altura);
            chao.addColorStop(0,'#A86D3E');chao.addColorStop(1,'#754827');
            ctx.fillStyle=chao;ctx.fillRect(0,altura*.83,largura,altura*.17);
            ctx.strokeStyle='rgba(62,36,22,.45)';ctx.lineWidth=2;
            const linhas=6;
            for(let i=1;i<linhas;i++){
                const y=altura*(.83+i*.17/linhas);
                ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(largura,y);ctx.stroke();
            }
            for(let x=largura*.08;x<largura;x+=largura*.16){
                ctx.beginPath();ctx.moveTo(x,altura*.83);ctx.lineTo(x+(Math.sin(x)*.01*largura),altura);ctx.stroke();
            }
            ctx.restore();

            // Pequenos fardos de palha nas extremidades: não invadem as portas.
            function fardo(x,y,w,h){
                ctx.save();
                ctx.fillStyle='#E7B84D';ctx.strokeStyle='#B77B25';ctx.lineWidth=Math.max(2,w*.018);
                ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,Math.min(w,h)*.10);ctx.fill();ctx.stroke();
                ctx.strokeStyle='rgba(126,79,25,.42)';ctx.lineWidth=Math.max(1,w*.012);
                for(let i=1;i<4;i++){const yy=y-h/2+i*h/4;ctx.beginPath();ctx.moveTo(x-w*.42,yy);ctx.lineTo(x+w*.42,yy);ctx.stroke();}
                ctx.restore();
            }
            const base=altura*.82;
            fardo(largura*.045,base-altura*.045,largura*.08,altura*.09);
            fardo(largura*.955,base-altura*.045,largura*.08,altura*.09);
            fardo(largura*.075,base-altura*.105,largura*.065,altura*.07);
            fardo(largura*.925,base-altura*.105,largura*.065,altura*.07);

            // Pequenos pontos de luz/poeira, muito subtis.
            ctx.save();ctx.fillStyle='rgba(255,224,150,.18)';
            for(let i=0;i<14;i++){
                const x=(i*97)%largura;
                const y=altura*(.12+((i*37)%58)/100);
                ctx.beginPath();ctx.arc(x,y+Math.sin(agora*.0005+i)*3,1.5+(i%3),0,Math.PI*2);ctx.fill();
            }
            ctx.restore();
        }

        function desenharPortaEscondida(porta, r, agora) {
            const abertura = porta.abertura;
            const centroY = porta.y + r*0.10;
            const portaW = r*1.48;
            const portaH = r*1.82;
            const topo = centroY - portaH/2;
            const balanco = Math.sin(agora*0.002 + porta.fase) * r*0.015;

            // Moldura exterior colorida e bastante viva.
            ctx.save();
            ctx.translate(porta.x, centroY);
            ctx.fillStyle = porta.animal.cor;
            ctx.shadowBlur = 20;
            ctx.shadowColor = porta.animal.cor;
            ctx.beginPath();
            ctx.roundRect(-portaW*0.57, -portaH*0.56, portaW*1.14, portaH*1.12, r*0.16);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Interior escuro da porta.
            ctx.fillStyle = '#10101A';
            ctx.beginPath();
            ctx.roundRect(-portaW/2, -portaH/2, portaW, portaH, r*0.11);
            ctx.fill();
            ctx.restore();

            // Animal aparece primeiro no interior e cresce ao abrir.
            if (abertura > 0.08 || porta.salto > 0.02) {
                const progresso = Math.min(1, abertura*1.15 + porta.salto*0.18);
                const escala = 0.58 + progresso*0.48;
                const yAnimal = centroY + r*0.12 - progresso*r*0.14 - porta.salto*r*0.22;
                ctx.save();
                ctx.translate(porta.x + balanco, yAnimal);
                ctx.scale(escala, escala);
                ctx.globalAlpha = Math.min(1, 0.25 + progresso*0.95);
                desenharIlustracaoAnimal(0, 0, porta.animal.tipo, r*0.78);
                ctx.globalAlpha = 1;
                ctx.restore();
            }

            // Uma única folha vista entreaberta. A dobradiça fica à esquerda;
            // a folha desloca-se e estreita-se, simulando abertura em perspetiva.
            const aberturaBase = 0.18; // sempre ligeiramente entreaberta
            const a = aberturaBase + abertura*0.82;
            const folhaW = portaW * (1 - a*0.72);
            const folhaX = porta.x - portaW/2 + folhaW/2 - a*portaW*0.06;

            ctx.save();
            ctx.translate(folhaX, centroY);
            ctx.fillStyle = porta.animal.cor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(0,0,0,0.55)';
            ctx.beginPath();
            ctx.roundRect(-folhaW/2, -portaH/2, folhaW, portaH, r*0.10);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Painéis claros, mantendo a cor dominante da porta.
            ctx.strokeStyle = 'rgba(255,255,255,0.42)';
            ctx.lineWidth = Math.max(2, r*0.018);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            ctx.beginPath();
            ctx.roundRect(-folhaW*0.34, -portaH*0.34, folhaW*0.68, portaH*0.27, r*0.07);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(-folhaW*0.34, portaH*0.04, folhaW*0.68, portaH*0.27, r*0.07);
            ctx.fill();

            // Maçaneta.
            ctx.fillStyle = '#FFE082';
            ctx.shadowBlur = 8; ctx.shadowColor = '#FFD54F';
            ctx.beginPath();
            ctx.arc(folhaW*0.34, r*0.06, r*0.075, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();

            // Olhos na fresta enquanto a porta ainda está maioritariamente fechada.
            if (abertura < 0.62) {
                const frestaX = porta.x + portaW*0.28;
                const olhoY = topo + portaH*0.38;
                const piscar = Math.sin(agora*0.0027 + porta.fase) > 0.988;
                ctx.save();
                ctx.fillStyle = '#FFFDF2';
                ctx.shadowBlur = 12; ctx.shadowColor = '#FFF176';
                ctx.beginPath(); ctx.ellipse(frestaX-r*0.12, olhoY, r*0.11, r*0.095, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(frestaX+r*0.12, olhoY, r*0.11, r*0.095, 0, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#20202A';
                if (!piscar) {
                    ctx.beginPath(); ctx.arc(frestaX-r*0.12, olhoY, r*0.043, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(frestaX+r*0.12, olhoY, r*0.043, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillRect(frestaX-r*0.20, olhoY-2, r*0.16, 4);
                    ctx.fillRect(frestaX+r*0.04, olhoY-2, r*0.16, 4);
                }
                ctx.restore();
            }

            if (porta.aberta) {
                ctx.save();
                ctx.font = `bold ${Math.max(18,Math.min(30,r*0.32))}px sans-serif`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillStyle='rgba(255,255,255,0.96)';
                ctx.shadowBlur=8; ctx.shadowColor='#000';
                ctx.fillText(porta.animal.nome, porta.x, topo-r*0.17);
                ctx.restore();
            }
        }

        /* =================================================================
           LÓGICA: ENCAIXE MÁGICO
           ================================================================= */
        function reconfigurarEncaixes() {
            const tam = Math.min(largura, altura) * 0.12;
            const ladoEsquerdoX = largura * 0.28;
            const ladoDireitoX = largura * 0.75;

            if (pecaPaiEncaixe) {
                pecaPaiEncaixe.tamanho = tam;
                pecaPaiEncaixe.startX = ladoDireitoX;
                pecaPaiEncaixe.startY = altura * 0.5;
                if (!pecaPaiEncaixe.arrastando) {
                    pecaPaiEncaixe.x = pecaPaiEncaixe.startX;
                    pecaPaiEncaixe.y = pecaPaiEncaixe.startY;
                }
            }

            if (encaixes.length === 2) {
                encaixes[0].x = ladoEsquerdoX;
                encaixes[0].y = altura * 0.3;
                encaixes[0].tamanho = tam;

                encaixes[1].x = ladoEsquerdoX;
                encaixes[1].y = altura * 0.7;
                encaixes[1].tamanho = tam;
            }
        }

        function iniciarNovaSequenciaEncaixe() {
            emTransicaoEncaixe = false;
            const formaCerta = TIPOS_FORMAS[Math.floor(Math.random() * TIPOS_FORMAS.length)];
            let formaErrada = TIPOS_FORMAS[Math.floor(Math.random() * TIPOS_FORMAS.length)];
            while (formaErrada === formaCerta) {
                formaErrada = TIPOS_FORMAS[Math.floor(Math.random() * TIPOS_FORMAS.length)];
            }

            const corPeca = CORES_ENCAIXE[Math.floor(Math.random() * CORES_ENCAIXE.length)];
            const posicaoCerta = Math.random() < 0.5 ? 0 : 1;

            encaixes = [
                { tipo: posicaoCerta === 0 ? formaCerta : formaErrada, eCorreta: posicaoCerta === 0 },
                { tipo: posicaoCerta === 1 ? formaCerta : formaErrada, eCorreta: posicaoCerta === 1 }
            ];

            pecaPaiEncaixe = {
                tipo: formaCerta,
                cor: corPeca,
                arrastando: false
            };

            reconfigurarEncaixes();
        }

        /* =================================================================
           PIANO MÁGICO — um pequeno órgão para a Tatá 🎹
           ================================================================= */
        function reconfigurarPiano() {
            const base = Math.min(largura, altura);
            const topo = altura * 0.23;
            const margem = largura * 0.055;
            const larguraTecla = (largura - margem*2) / 7;
            const alturaTecla = Math.min(altura*0.58, base*0.72);
            botoesInstrumentoPiano = [];
            const areaX = largura * .055, areaW = largura * .89;
            const gap = Math.max(4, base*.008);
            const bw = (areaW-gap*7)/8;
            const by = altura*.155, bh = Math.min(base*.075, altura*.065);
            INSTRUMENTOS_PIANO.forEach((inst,i)=>botoesInstrumentoPiano.push({
                ...inst, x:areaX+i*(bw+gap), y:by, w:bw, h:bh
            }));
            teclasPiano = [];
            const brancas = NOTAS_PIANO.filter(n=>n.branca);
            brancas.forEach((n,i)=>teclasPiano.push({
                ...n, x:margem+i*larguraTecla, y:topo, w:larguraTecla, h:alturaTecla,
                pressionada:0, fase:Math.random()*6
            }));
            const pretas = [0,1,3,4,5];
            const nomes = [NOTAS_PIANO[7],NOTAS_PIANO[8],NOTAS_PIANO[9],NOTAS_PIANO[10],NOTAS_PIANO[11]];
            pretas.forEach((idx,i)=>{
                const centro = margem+(idx+1)*larguraTecla;
                teclasPiano.push({
                    ...nomes[i], x:centro-larguraTecla*.30, y:topo, w:larguraTecla*.60, h:alturaTecla*.60,
                    pressionada:0, fase:Math.random()*6
                });
            });
            notasPianoAtivas=[];
        }

        function pontoNaTeclaPiano(x,y,t){ return x>=t.x && x<=t.x+t.w && y>=t.y && y<=t.y+t.h; }

        function tocarNotaPiano(nota){
            iniciarAudio();
            const agora=audioCtx.currentTime+0.005;
            const master=audioCtx.createGain();
            const tipo=INSTRUMENTOS_PIANO.find(i=>i.nome===instrumentoPianoAtual)?.tipo || 'orgao';
            const dur=tipo==='bells'||tipo==='steel'?1.8:tipo==='bass'?0.8:1.25;
            master.gain.setValueAtTime(0.0001,agora);
            master.gain.exponentialRampToValueAtTime(tipo==='bass'?.30:.23,agora+0.012);
            master.gain.exponentialRampToValueAtTime(0.001,agora+dur);
            master.connect(audioCtx.destination);
            const partials = {
                orgao:[[1,'sine',1],[2,'sine',.32],[3,'sine',.12],[4,'sine',.045]],
                bass:[[1,'triangle',1],[2,'sine',.20],[.5,'sine',.16]],
                steel:[[1,'sine',1],[2.01,'sine',.38],[3.98,'triangle',.16],[6.99,'sine',.06]],
                bells:[[1,'sine',1],[2.71,'sine',.30],[4.07,'sine',.16],[6.8,'sine',.07]],
                guitar:[[1,'triangle',1],[2,'triangle',.28],[3,'sine',.10],[5,'sine',.035]],
                marimba:[[1,'sine',1],[3.0,'sine',.18],[4.2,'triangle',.07]],
                vibra:[[1,'sine',1],[2,'sine',.22],[3,'sine',.09],[4.01,'sine',.04]],
                piano:[[1,'sine',1],[2,'triangle',.18],[3,'sine',.07],[4,'triangle',.025]]
            }[tipo];
            partials.forEach(([mult,wave,level])=>{
                const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
                osc.type=wave; osc.frequency.value=nota.freq*mult;
                g.gain.value=level; osc.connect(g); g.connect(master);
                osc.start(agora); osc.stop(agora+dur+.05);
            });
        }

        function tocarInstrumentoPiano(nome){
            instrumentoPianoAtual=nome;
            tocarNotaPiano({freq:392,nome:'Sol',glyph:'♪'});
        }

        function ativarTeclaPiano(t){
            t.pressionada=1;
            tocarNotaPiano(t);
            notasPianoAtivas.push({x:t.x+t.w/2,y:t.y+t.h*.18,nome:t.nome,glyph:t.glyph,vida:1,vy:-1.2,rot:(Math.random()-.5)*.015});
        }

        function desenharPiano(){
            const base=Math.min(largura,altura);
            // Caixa/órgão mágico
            ctx.save();
            ctx.fillStyle='rgba(72,38,25,.82)'; ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=25;
            ctx.beginPath(); ctx.roundRect(largura*.035,altura*.15,largura*.93,altura*.72,base*.025); ctx.fill();
            ctx.shadowBlur=0;
            ctx.fillStyle='rgba(255,214,102,.18)'; ctx.beginPath(); ctx.roundRect(largura*.055,altura*.17,largura*.89,altura*.06,base*.015); ctx.fill();
            // Selector mágico de timbres — no lugar dos tubos de órgão
            botoesInstrumentoPiano.forEach((b,i)=>{
                const ativo=b.nome===instrumentoPianoAtual;
                ctx.fillStyle=ativo?'#FFE082':'rgba(255,255,255,.92)';
                ctx.strokeStyle=ativo?'#FF8F00':'rgba(92,67,54,.55)';
                ctx.lineWidth=ativo?3:1.5;
                ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,base*.012); ctx.fill(); ctx.stroke();
                ctx.fillStyle=ativo?'#6D3B00':'#4E4038';
                ctx.font=`bold ${Math.max(10,Math.min(16,base*.024))}px sans-serif`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(b.nome,b.x+b.w/2,b.y+b.h/2);
                if(ativo){ctx.fillStyle='#FF9800';ctx.beginPath();ctx.arc(b.x+b.w*.12,b.y+b.h/2,base*.008,0,Math.PI*2);ctx.fill();}
            });
            ctx.textBaseline='alphabetic';
            // Teclas brancas

        /* =================================================================
           INSTRUMENTOS MÁGICOS
           ================================================================= */
        const TIPOS_INSTRUMENTOS = ['xilofone', 'tambor', 'sino', 'maracas'];
        const CORES_INSTRUMENTOS = ['#FF8A65', '#64B5F6', '#81C784', '#FFD54F'];

        function reconfigurarInstrumentos() {
            const portrait = altura > largura;
            const marg = Math.min(largura, altura) * 0.045;
            const gap = Math.min(largura, altura) * 0.035;
            const topo = altura * 0.12;
            const baseLivre = altura * 0.80;
            let cols = portrait ? 2 : 4;
            let rows = portrait ? 2 : 1;
            const celW = (largura - marg * 2 - gap * (cols - 1)) / cols;
            const celH = (baseLivre - gap * (rows - 1)) / rows;

            instrumentos = TIPOS_INSTRUMENTOS.map((tipo, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                return {
                    tipo,
                    x: marg + col * (celW + gap) + celW / 2,
                    y: topo + row * (celH + gap) + celH / 2,
                    w: celW,
                    h: celH,
                    pulso: 0,
                    brilho: 0,
                    nota: 0
                };
            });
        }

        function pontoNoInstrumento(x, y, inst) {
            return Math.abs(x - inst.x) <= inst.w * 0.47 && Math.abs(y - inst.y) <= inst.h * 0.45;
        }

        function tocarSomInstrumento(tipo) {
            if (!audioCtx) return;
            const agora = audioCtx.currentTime + 0.01;
            const notas = {
                xilofone: [261.63, 329.63, 392.00, 523.25],
                tambor: [110, 82.41, 65.41],
                sino: [783.99, 1046.50, 1318.51],
                maracas: [180, 240, 320]
            }[tipo];

            if (tipo === 'tambor') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, agora);
                osc.frequency.exponentialRampToValueAtTime(55, agora + 0.16);
                gain.gain.setValueAtTime(0.5, agora);
                gain.gain.exponentialRampToValueAtTime(0.001, agora + 0.18);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(agora); osc.stop(agora + 0.19);
                return;
            }

            const qtd = tipo === 'maracas' ? 4 : 3;
            for (let i = 0; i < qtd; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const inicio = agora + i * (tipo === 'maracas' ? 0.035 : 0.07);
                const freq = notas[(Math.floor(Math.random() * notas.length))] * (tipo === 'maracas' ? (0.9 + Math.random() * 0.35) : 1);
                osc.type = tipo === 'sino' ? 'sine' : 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, inicio);
                gain.gain.linearRampToValueAtTime(tipo === 'maracas' ? 0.08 : 0.18, inicio + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, inicio + (tipo === 'sino' ? 0.9 : 0.22));
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(inicio); osc.stop(inicio + (tipo === 'sino' ? 0.95 : 0.25));
            }
        }

        function criarParticulasInstrumento(x, y, cor) {
            for (let i = 0; i < 14; i++) {
                particulasInstrumentos.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: -Math.random() * 7 - 1,
                    raio: Math.random() * 5 + 2,
                    opacidade: 1,
                    cor
                });
            }
        }

        function ativarInstrumento(i) {
            const inst = instrumentos[i];
            if (!inst) return;
            iniciarAudio();
            inst.pulso = 1;
            inst.brilho = 1;
            inst.nota = Math.random();
            ultimoInstrumento = i;
            tocarSomInstrumento(inst.tipo);
            criarParticulasInstrumento(inst.x, inst.y - inst.h * 0.05, CORES_INSTRUMENTOS[i]);
        }

        function desenharInstrumento(inst, i) {
            const p = 1 + inst.pulso * 0.045;
            ctx.save();
            ctx.translate(inst.x, inst.y);
            ctx.scale(p, p);

            // Cartão grande e arredondado
            ctx.fillStyle = 'rgba(255,255,255,0.07)';
            ctx.shadowBlur = 18;
            ctx.shadowColor = CORES_INSTRUMENTOS[i];
            ctx.beginPath();
            const r = Math.min(inst.w, inst.h) * 0.08;
            ctx.roundRect(-inst.w*0.47, -inst.h*0.45, inst.w*0.94, inst.h*0.9, r);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (inst.tipo === 'xilofone') {
                const barW = inst.w * 0.58, barH = Math.min(inst.h * 0.12, 42);
                const cores = ['#EF5350','#FFCA28','#66BB6A','#42A5F5','#AB47BC','#FF7043'];
                for (let k = 0; k < 6; k++) {
                    const yy = -barH*3 + k * barH*1.12;
                    const ww = barW * (0.72 + k*0.055);
                    ctx.fillStyle = cores[k];
                    ctx.beginPath(); ctx.roundRect(-ww/2, yy, ww, barH*0.72, barH*0.25); ctx.fill();
                }
                ctx.fillStyle = '#C9A66B';
                ctx.beginPath(); ctx.arc(-barW*0.58, inst.h*0.24, barH*0.34, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(barW*0.58, inst.h*0.24, barH*0.34, 0, Math.PI*2); ctx.fill();
            } else if (inst.tipo === 'tambor') {
                const rr = Math.min(inst.w, inst.h) * 0.25;
                ctx.fillStyle = '#D97A36';
                ctx.beginPath(); ctx.ellipse(0, 0, rr*1.45, rr, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFF3D6';
                ctx.beginPath(); ctx.ellipse(0, -rr*0.12, rr*1.28, rr*0.68, 0, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#8D4B24'; ctx.lineWidth = Math.max(5, rr*0.07);
                for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k*rr*0.45, rr*0.45); ctx.lineTo(k*rr*0.35, -rr*0.5); ctx.stroke(); }
                ctx.fillStyle = '#F4C27A';
                ctx.beginPath(); ctx.arc(-rr*0.9, -rr*0.95, rr*0.13, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(rr*0.9, -rr*0.95, rr*0.13, 0, Math.PI*2); ctx.fill();
            } else if (inst.tipo === 'sino') {
                const rr = Math.min(inst.w, inst.h) * 0.24;
                ctx.fillStyle = '#FFD54F';
                ctx.beginPath(); ctx.arc(0, -rr*0.05, rr*0.95, Math.PI, Math.PI*2); ctx.lineTo(rr*1.05, rr*0.8); ctx.lineTo(-rr*1.05, rr*0.8); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#FFF3A0';
                ctx.beginPath(); ctx.arc(-rr*0.3, -rr*0.35, rr*0.25, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#E0A900';
                ctx.fillRect(-rr*0.12, rr*0.75, rr*0.24, rr*0.28);
                ctx.beginPath(); ctx.arc(0, rr*1.02, rr*0.22, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#FFE082'; ctx.lineWidth = Math.max(5, rr*0.06);
                ctx.beginPath(); ctx.moveTo(0, -rr*1.15); ctx.lineTo(0, -rr*0.95); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, -rr*1.25, rr*0.16, 0, Math.PI*2); ctx.fill();
            } else {
                const rr = Math.min(inst.w, inst.h) * 0.22;
                [-1,1].forEach(side => {
                    ctx.save(); ctx.translate(side*rr*0.72, 0); ctx.rotate(side*0.16);
                    ctx.fillStyle = '#8BC34A';
                    ctx.beginPath(); ctx.ellipse(0, 0, rr*0.72, rr*1.05, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#DFF5B0';
                    ctx.beginPath(); ctx.ellipse(0, -rr*0.48, rr*0.55, rr*0.18, 0, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#689F38'; ctx.lineWidth = Math.max(4, rr*0.06);
                    for (let k=0;k<4;k++){ ctx.beginPath(); ctx.moveTo(-rr*0.45+k*rr*0.3, rr*0.15); ctx.lineTo(-rr*0.45+k*rr*0.3, rr*0.8); ctx.stroke(); }
                    ctx.restore();
                });
            }

            if (inst.brilho > 0) {
                ctx.globalAlpha = inst.brilho * 0.45;
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.arc(-inst.w*0.27, -inst.h*0.25, Math.min(inst.w, inst.h)*0.055, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        /* =================================================================
           AQUÁRIO MÁGICO — versão renovada
           ================================================================= */
        const FICHAS_PEIXES_AQUARIO = [
            {arquivo:'peixe_azul_listrado.png', nome:'Peixe Azul', frente:1},
            {arquivo:'peixe_palhaco.png', nome:'Peixe-Palhaço', frente:1},
            {arquivo:'baiacu.png', nome:'Baiacu', frente:1},
            {arquivo:'peixe_azul_rosa.png', nome:'Peixe Tropical', frente:1},
            {arquivo:'peixe_turquesa.png', nome:'Peixe Colorido', frente:1},
            {arquivo:'peixe_dourado.png', nome:'Peixe Dourado', frente:1},
            {arquivo:'peixe_vermelho.png', nome:'Peixe Vermelho', frente:-1}
        ];
        const IMAGENS_PEIXES_AQUARIO = FICHAS_PEIXES_AQUARIO.map(f => {
            const img = new Image();
            img.src = 'assets/peixes/' + f.arquivo;
            return img;
        });
        const IMG_MEDUSA_AQUARIO = new Image();
        IMG_MEDUSA_AQUARIO.src = 'assets/criaturas/medusa.png';
        const IMG_CAVALO_MARINHO_AQUARIO = new Image();
        IMG_CAVALO_MARINHO_AQUARIO.src = 'assets/criaturas/cavalo_marinho.png';

        function reconfigurarAquario() {
            const base = Math.min(largura, altura);
            const posicoes = [
                [0.13,0.27,  1], [0.36,0.22,-1], [0.64,0.27, 1],
                [0.87,0.40,-1], [0.21,0.52, 1], [0.50,0.56,-1],
                [0.78,0.62, 1]
            ];
            const ordem = Array.from({length:FICHAS_PEIXES_AQUARIO.length},(_,i)=>i).sort(()=>Math.random()-0.5);
            peixesAquario = posicoes.map(([px,py,direcao],i)=>({
                x:largura*px, y:altura*py,
                r:base*(0.070+Math.random()*0.010),
                vx:direcao*(0.00065+Math.random()*0.00038),
                fase:Math.random()*Math.PI*2,
                brilho:0, cauda:0, imgIndex:ordem[i]
            }));

            // Duas medusas e dois cavalos-marinhos. Alguns começam escondidos
            // entre as plantas e são libertados ao tocar nas algas/corais.
            criaturasAquario = [
                {tipo:'medusa',x:largura*.78,y:altura*.28,r:base*.070,fase:.7,brilho:0,vy:-.00058,pulo:0,espelho:1,ativa:false,entrada:0},
                {tipo:'medusa',x:largura*.16,y:altura*.40,r:base*.062,fase:3.1,brilho:0,vy:.00060,pulo:0,espelho:-1,ativa:false,entrada:0},
                {tipo:'cavalo',x:largura*.50,y:altura*.47,r:base*.082,fase:2.2,brilho:0,vy:-.00052,pulo:0,espelho:1,ativa:false,entrada:0},
                {tipo:'cavalo',x:largura*.61,y:altura*.63,r:base*.074,fase:4.5,brilho:0,vy:.00055,pulo:0,espelho:-1,ativa:false,entrada:0}
            ];

            // Apenas algas e corais no fundo. Mantêm-se baixos (~1/3 da altura anterior) e são pontos de descoberta.
            plantasAquario = [
                {tipo:'alga',x:.08,y:.91,esc:1.05,cor:'#28B86B',fase:1.2},
                {tipo:'coral',x:.22,y:.91,esc:.88,cor:'#FF6F91',fase:2.1},
                {tipo:'alga',x:.47,y:.93,esc:1.08,cor:'#24A96B',fase:2.8},
                {tipo:'coral',x:.73,y:.91,esc:.92,cor:'#BA68C8',fase:.8},
                {tipo:'alga',x:.91,y:.91,esc:1.10,cor:'#25A96B',fase:1.1}
            ];
            bolhasAquario=[]; ondasAquario=[]; brilhosAquario=[];
            for(let i=0;i<30;i++) criarBolhaAquario(Math.random()*largura,altura*(0.10+Math.random()*0.78),true);
        }

        function criarBolhaAquario(x,y,solta=false) {
            bolhasAquario.push({
                x,y,
                r:2+Math.random()*6,
                vx:(Math.random()-0.5)*0.00022,
                vy:-(0.00065+Math.random()*0.00075),
                opacidade:solta?0.25:1,
                vida:solta?1:180,
                temporaria:!solta
            });
        }
        function criarBrilhoAquario(x,y,cor='#FFF176',n=12) {
            for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,f=0.001+Math.random()*0.003;brilhosAquario.push({x,y,vx:Math.cos(a)*f,vy:Math.sin(a)*f,r:2+Math.random()*4,vida:1,cor});}
        }
        function tocarNotaAquario(freq,dur=0.25,volume=0.08,tipo='sine') {
            if(!audioCtx)return;
            const t=audioCtx.currentTime+0.01,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
            osc.type=tipo;osc.frequency.setValueAtTime(freq,t);osc.frequency.exponentialRampToValueAtTime(freq*1.28,t+dur*.7);
            gain.gain.setValueAtTime(.001,t);gain.gain.linearRampToValueAtTime(volume,t+.02);gain.gain.exponentialRampToValueAtTime(.001,t+dur);
            osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+dur+.02);
        }
        function tocarSomPeixeAquario(){tocarNotaAquario(330+Math.random()*150,.22,.075,'sine');}
        function tocarSomMedusaAquario(){tocarNotaAquario(520+Math.random()*100,.30,.06,'triangle');}
        function tocarSomCavaloAquario(){tocarNotaAquario(250+Math.random()*70,.35,.065,'sine');}
        function tocarSomTesouroAquario(){tocarNotaAquario(523,.16,.06,'triangle');setTimeout(()=>tocarNotaAquario(784,.22,.05,'triangle'),90);}
        function tocarBolhaAquario(){tocarNotaAquario(650+Math.random()*220,.14,.04,'sine');}

        function tocarAquario(x,y){
            iniciarAudio(); let escolhido=null,melhor=Infinity;
            peixesAquario.forEach(p=>{const d=Math.hypot(x-p.x,y-p.y);if(d<p.r*2.15&&d<melhor){melhor=d;escolhido=p;}});
            if(escolhido){
                escolhido.brilho=1; escolhido.cauda=1; escolhido.vx*=-1;
                tocarSomPeixeAquario();
                for(let i=0;i<10;i++)criarBolhaAquario(escolhido.x+(Math.random()-.5)*escolhido.r*1.4,escolhido.y-escolhido.r*.3);
                criarBrilhoAquario(escolhido.x,escolhido.y,'#FFF176',12);
                ondasAquario.push({x:escolhido.x,y:escolhido.y,r:escolhido.r*.35,opacidade:.75});return;
            }

            // As algas e corais são "portas" para as criaturas escondidas.
            let plantaEscolhida=null,melhorPlanta=Infinity;
            for(const p of plantasAquario){
                const px=p.x*largura, py=p.y*altura;
                const d=Math.hypot(x-px,y-py);
                if(d<baseAquario()*.13 && d<melhorPlanta){melhorPlanta=d;plantaEscolhida=p;}
            }
            if(plantaEscolhida){
                plantaEscolhida.brilho=1; plantaEscolhida.pulso=1;
                const escondidas=criaturasAquario.filter(c=>!c.ativa);
                if(escondidas.length){
                    const c=escondidas[Math.floor(Math.random()*escondidas.length)];
                    c.ativa=true; c.entrada=1; c.pulo=1; c.brilho=1;
                    c.x=plantaEscolhida.x*largura + (Math.random()-.5)*baseAquario()*.08;
                    c.y=plantaEscolhida.y*altura - baseAquario()*.13;
                    c.vy=(Math.random()<.5?-1:1)*(0.00050+Math.random()*.00012);
                    c.espelho=Math.random()<.5?-1:1;
                    if(c.tipo==='medusa')tocarSomMedusaAquario();else tocarSomCavaloAquario();
                    for(let i=0;i<12;i++)criarBolhaAquario(c.x+(Math.random()-.5)*c.r,c.y+c.r*.4);
                    criarBrilhoAquario(c.x,c.y,c.tipo==='medusa'?'#F5B7FF':'#FFD54F',18);
                    ondasAquario.push({x:c.x,y:c.y,r:c.r*.25,opacidade:.7});
                }
                return;
            }

            for(const c of criaturasAquario){
                if(!c.ativa) continue;
                const d=Math.hypot(x-c.x,y-c.y);
                if(d<c.r*1.35){
                    c.brilho=1; c.pulo=1; c.vy*=-1; c.espelho*=-1;
                    if(c.tipo==='medusa')tocarSomMedusaAquario();else tocarSomCavaloAquario();
                    for(let i=0;i<8;i++)criarBolhaAquario(c.x+(Math.random()-.5)*c.r,c.y+c.r*.4);
                    criarBrilhoAquario(c.x,c.y,c.tipo==='medusa'?'#F5B7FF':'#FFD54F',14);
                    ondasAquario.push({x:c.x,y:c.y,r:c.r*.3,opacidade:.65});return;
                }
            }
            tocarBolhaAquario();for(let i=0;i<5;i++)criarBolhaAquario(x+(Math.random()-.5)*25,y+(Math.random()-.5)*18);ondasAquario.push({x,y,r:8,opacidade:.6});
        }

        function baseAquario(){return Math.min(largura,altura);}

        function desenharPeixeAquario(p,agora){
            const img=IMAGENS_PEIXES_AQUARIO[p.imgIndex];if(!img.complete||!img.naturalWidth)return;
            const ficha=FICHAS_PEIXES_AQUARIO[p.imgIndex];
            const s=(p.vx>=0?1:-1)*ficha.frente;
            const maxW=p.r*2.9,maxH=p.r*2.05,ratio=img.naturalWidth/img.naturalHeight;
            let w=maxW,h=w/ratio;if(h>maxH){h=maxH;w=h*ratio;}
            const pulso=1+p.cauda*.08;
            ctx.save();ctx.translate(p.x,p.y+Math.sin(agora*.001+p.fase)*baseAquario()*.006);ctx.scale(s*pulso,pulso);ctx.globalAlpha=1;ctx.shadowBlur=p.brilho*22;ctx.shadowColor='#FFFFFF';ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
        }
        function desenharMedusaAquario(c,agora){
            if(!IMG_MEDUSA_AQUARIO.complete||!IMG_MEDUSA_AQUARIO.naturalWidth)return;
            const bob=Math.sin(agora*.001+c.fase)*c.r*.10;const pulo=c.pulo;
            const y=c.y+bob-pulo*c.r*.65;
            const escala=1+pulo*.12;const w=c.r*2.2*escala,h=c.r*2.2*escala;
            ctx.save();ctx.translate(c.x,y);ctx.scale(c.espelho*escala,escala);ctx.globalAlpha=Math.min(1,0.65+c.entrada*.35);ctx.shadowBlur=c.brilho*24;ctx.shadowColor='#F5B7FF';ctx.drawImage(IMG_MEDUSA_AQUARIO,-w/2,-h/2,w,h);ctx.restore();
        }
        function desenharCavaloAquario(c,agora){
            if(!IMG_CAVALO_MARINHO_AQUARIO.complete||!IMG_CAVALO_MARINHO_AQUARIO.naturalWidth)return;
            const bob=Math.sin(agora*.001+c.fase)*c.r*.08;const y=c.y+bob-c.pulo*c.r*.65;const escala=1+c.pulo*.10;
            const ratio=IMG_CAVALO_MARINHO_AQUARIO.naturalWidth/IMG_CAVALO_MARINHO_AQUARIO.naturalHeight;const h=c.r*2.25*escala,w=h*ratio;

        const toquesAtivos = new Set();

        canvas.addEventListener('pointerdown', (e) => {
            if (!jogoAtual) return;
            if (toquesAtivos.has(e.pointerId)) return;
            toquesAtivos.add(e.pointerId);

            const rect = canvas.getBoundingClientRect();
            const ptX = e.clientX - rect.left;
            const ptY = e.clientY - rect.top;

            if (jogoAtual === 'toque') {
                iniciarAudio();
                formasToque.push(new FormaMagica(ptX, ptY));
                tocarNotaMusical();
                const corP = CORES_TOQUE[Math.floor(Math.random() * CORES_TOQUE.length)];
                for (let i = 0; i < 8; i++) {
                    particulasToque.push(new ParticulaToque(ptX, ptY, corP));
                }
            } else if (jogoAtual === 'pintura') {
                iniciarAudio();
                mouseBaixoPintura = true;
                adicionarPontoPintura(ptX, ptY);
            } else if (jogoAtual === 'baloes') {
                iniciarAudio();
                // Ciclo para garantir que cada dedo rebenta no máximo um balão
                for (let i = 0; i < baloes.length; i++) {
                    const b = baloes[i];
                    if (!b.morto) {
                        const dx = ptX - b.currentX;
                        const dy = ptY - b.y;
                        if ((dx * dx) / (b.rx * b.rx) + (dy * dy) / (b.ry * b.ry) <= 1.2) {
                            if (b.especial) {
                                tocarSomMagico();
                                const coresEsp = [b.corInfo.luz, '#FFD700', '#FFF', '#00E5FF', '#FF007F'];
                                for (let j = 0; j < 50; j++) {
                                    const c = coresEsp[Math.floor(Math.random() * coresEsp.length)];
                                    particulasBaloes.push(new ParticulaBalao(b.currentX, b.y, c, true));
                                }
                                sorpresasBaloes.push(new SurpresaFlutuante(b.currentX, b.y));
                            } else {
                                tocarSomPop();
                                for (let j = 0; j < 30; j++) {
                                    particulasBaloes.push(new ParticulaBalao(b.currentX, b.y, b.corInfo.base));
                                }
                            }
                            b.morto = true;
                            break; // Para imediatamente para este dedo não rebentar mais nenhum
                        }
                    }
                }
            } else if (jogoAtual === 'escondidas') {
                const r = getRaioPortaEscondida();
                for (const porta of portasEscondidas) {
                    if (Math.hypot(ptX-porta.x, ptY-(porta.y+r*0.25)) < r*1.45) {
                        abrirPortaEscondida(porta);
                        break;
                    }
                }
            } else if (jogoAtual === 'piano') {
                iniciarAudio();
                for(const b of botoesInstrumentoPiano){
                    if(pontoNaTeclaPiano(ptX,ptY,b)){ tocarInstrumentoPiano(b.nome); return; }
                }
                let escolhida=null;
                // Pretas primeiro para preservar a sensação de teclado real.
                for(const t of teclasPiano.filter(t=>!t.branca)) if(pontoNaTeclaPiano(ptX,ptY,t)){escolhida=t;break;}
                if(!escolhida) for(const t of teclasPiano.filter(t=>t.branca)) if(pontoNaTeclaPiano(ptX,ptY,t)){escolhida=t;break;}
                if(escolhida) ativarTeclaPiano(escolhida);
            } else if (jogoAtual === 'instrumentos') {
                for (let i = instrumentos.length - 1; i >= 0; i--) {
                    if (pontoNoInstrumento(ptX, ptY, instrumentos[i])) {
                        ativarInstrumento(i);

                tocarAquario(ptX, ptY);

                iniciarAudio();

                pecaPaiEncaixe.y = encaixeCerto.y;

        /* =================================================================
           CLASSES DE EFEITOS E OBJETOS

        class ParticulaToque {
            constructor(x, y, cor) {
                this.x = x; this.y = y; this.cor = cor;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.raio = Math.random() * 3 + 1;
                this.opacidade = 1;
            }
            atualizar() {
                this.x += this.vx; this.y += this.vy;
                this.vy += 0.1; this.opacidade -= 0.03; this.raio *= 0.97;
            }
            desenhar(ctx) {
                if (this.opacidade <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacidade;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.raio, 0, Math.PI * 2);
                ctx.fillStyle = this.cor; ctx.shadowBlur = 10; ctx.shadowColor = this.cor;
                ctx.fill(); ctx.restore();
            }
        }

        class FormaMagica {
            constructor(x, y) {
                this.x = x; this.y = y; this.tamanho = 10;
                this.corBase = CORES_TOQUE[Math.floor(Math.random() * CORES_TOQUE.length)];
                this.tipo = TIPOS_FORMAS[Math.floor(Math.random() * TIPOS_FORMAS.length)];
                this.opacidade = 1; this.vy = -0.5;
                this.rotacao = Math.random() * Math.PI * 2;
                this.velocidadeRotacao = (Math.random() - 0.5) * 0.05;
            }
            atualizar() {
                this.tamanho += 2.5; this.y += this.vy;
                this.rotacao += this.velocidadeRotacao; this.opacidade -= 0.012;
            }
            desenhar(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(this.opacidade, 0);
                ctx.translate(this.x, this.y); ctx.rotate(this.rotacao);
                desenharFormaGenerica(ctx, 0, 0, this.tamanho, this.tipo, this.corBase);
                ctx.restore();
            }
        }

        class PontoRasto {
            constructor(x, y, matiz) {
                this.x = x; this.y = y; this.raio = 25;
                this.cor = `hsl(${matiz}, 100%, 60%)`;
                this.opacidade = 1;
            }
            atualizar() {
                this.opacidade -= 0.02; this.raio *= 0.96;
            }
            desenhar(ctx) {
                if (this.opacidade <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacidade;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.raio, 0, Math.PI * 2);
                ctx.shadowBlur = 15; ctx.shadowColor = this.cor;
                ctx.fillStyle = this.cor; ctx.fill(); ctx.restore();
            }
        }

        function adicionarPontoPintura(x, y) {
            rastoPintura.push(new PontoRasto(x, y, matizPintura));
            matizPintura = (matizPintura + 2) % 360;
            const agora = Date.now();
            if (agora - ultimoSomPintura > 150) {
                ultimoSomPintura = agora;
                tocarNotaMusical();
            }
        }

        class ParticulaBalao {
            constructor(x, y, cor, ehEstrela = false) {
                this.x = x; this.y = y; this.cor = cor; this.ehEstrela = ehEstrela;
                this.tamanho = ehEstrela ? (6 + Math.random() * 8) : (4 + Math.random() * 6);
                const ang = Math.random() * Math.PI * 2;
                const forca = ehEstrela ? (6 + Math.random() * 10) : (3 + Math.random() * 8);
                this.vx = Math.cos(ang) * forca; this.vy = Math.sin(ang) * forca;
                this.gravidade = ehEstrela ? 0.12 : 0.2; this.atrito = 0.96;
                this.vida = 1.0; this.velocidadeMorte = 0.015 + Math.random() * 0.015;
                this.rotacao = Math.random() * Math.PI * 2;
            }
            atualizar(dt) {
                this.vx *= Math.pow(this.atrito, dt); this.vy *= Math.pow(this.atrito, dt);
                this.vy += this.gravidade * dt; this.x += this.vx * dt; this.y += this.vy * dt;
                this.vida -= this.velocidadeMorte * dt; this.rotacao += 0.1 * dt;
            }
            desenhar(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.vida);
                ctx.translate(this.x, this.y); ctx.rotate(this.rotacao);
                ctx.fillStyle = this.cor;
                if (this.ehEstrela) {
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.tamanho, -Math.sin((18 + i * 72) * Math.PI / 180) * this.tamanho);
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.tamanho/2), -Math.sin((54 + i * 72) * Math.PI / 180) * (this.tamanho/2));
                    }
                    ctx.closePath(); ctx.fill();
                } else {
                    ctx.fillRect(-this.tamanho/2, -this.tamanho/2, this.tamanho, this.tamanho);
                }
                ctx.restore();
            }
        }

        class SurpresaFlutuante {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.emoji = EMOJIS_SURPRESA[Math.floor(Math.random() * EMOJIS_SURPRESA.length)];
                this.escala = 0.4; this.escalaAlvo = 6.2; this.opacidade = 1.0; this.vy = -2.2;
            }
            atualizar(dt) {
                if (this.escala < this.escalaAlvo) this.escala += 0.12 * dt;
                this.y += this.vy * dt; this.opacidade -= 0.009 * dt;
            }
            desenhar(ctx) {
                if (this.opacidade <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacidade);
                ctx.font = `${Math.floor(40 * this.escala)}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        /* =================================================================
           DESENHOS AUXILIARES
           ================================================================= */
        function desenharFormaGenerica(ctx, x, y, tamanho, tipo, cor, eSilhueta = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();

            if (tipo === 'circulo') {
                ctx.arc(0, 0, tamanho, 0, Math.PI * 2);
            } else if (tipo === 'quadrado') {
                if(ctx.roundRect) ctx.roundRect(-tamanho, -tamanho, tamanho * 2, tamanho * 2, tamanho * 0.2);
                else ctx.rect(-tamanho, -tamanho, tamanho * 2, tamanho * 2);
            } else if (tipo === 'triangulo') {
                ctx.moveTo(0, -tamanho * 1.2);
                ctx.lineTo(tamanho * 1.1, tamanho * 0.8);
                ctx.lineTo(-tamanho * 1.1, tamanho * 0.8);
                ctx.closePath();
            } else if (tipo === 'estrela') {
                const picos = 5;
                const rExt = tamanho * 1.3, rInt = tamanho * 0.6;
                let ang = (Math.PI / 2) * 3, passo = Math.PI / picos;
                ctx.moveTo(0, -rExt);
                for (let i = 0; i < picos; i++) {
                    ctx.lineTo(Math.cos(ang) * rExt, Math.sin(ang) * rExt); ang += passo;
                    ctx.lineTo(Math.cos(ang) * rInt, Math.sin(ang) * rInt); ang += passo;
                }
                ctx.closePath();
            }

            if (eSilhueta) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; 
                ctx.fill();
                ctx.lineWidth = 3; 
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.setLineDash([8, 8]); 
                ctx.stroke();
            } else {
                ctx.fillStyle = cor; ctx.shadowBlur = 15; ctx.shadowColor = cor;
                ctx.fill();
            }
            ctx.restore();
        }

        function desenharBalao(b, dt) {
            ctx.save();
            b.tempoVida += 0.05 * dt;
            const x = b.currentX, y = b.y, rx = b.rx, ry = b.ry;

            if (b.especial) {
                const pulso = Math.sin(b.tempoVida * 4) * 8;
                ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 22 + pulso;
            } else {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)'; ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 8;
            }

            ctx.beginPath();
            ctx.moveTo(x, y - ry);
            ctx.bezierCurveTo(x + rx * 1.15, y - ry, x + rx * 1.1, y + ry * 0.35, x + rx * 0.25, y + ry * 0.88);
            ctx.bezierCurveTo(x + rx * 0.1, y + ry, x - rx * 0.1, y + ry, x - rx * 0.25, y + ry * 0.88);
            ctx.bezierCurveTo(x - rx * 1.1, y + ry * 0.35, x - rx * 1.15, y - ry, x, y - ry);
            ctx.closePath();

            const grad = ctx.createRadialGradient(x - rx * 0.35, y - ry * 0.35, rx * 0.05, x - rx * 0.1, y + ry * 0.1, ry * 1.15);
            grad.addColorStop(0, b.corInfo.luz); grad.addColorStop(0.45, b.corInfo.base); grad.addColorStop(1, b.corInfo.sombra);
            ctx.fillStyle = grad; ctx.fill();
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath(); ctx.ellipse(x - rx * 0.38, y - ry * 0.42, rx * 0.22, ry * 0.13, -Math.PI / 4, 0, Math.PI * 2); ctx.fill();

            if (b.especial) {
                ctx.font = `${Math.floor(rx * 0.75)}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('⭐', x, y - 2);
            }

            ctx.fillStyle = b.corInfo.sombra;
            ctx.beginPath();
            ctx.moveTo(x - 7, y + ry * 0.92); ctx.lineTo(x + 7, y + ry * 0.92);
            ctx.lineTo(x + 10, y + ry * 0.92 + 10); ctx.lineTo(x - 10, y + ry * 0.92 + 10);
            ctx.closePath(); ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)'; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.moveTo(x, y + ry * 0.92 + 10);
            ctx.bezierCurveTo(x + 12, y + ry + 35, x - 12, y + ry + 65, x + 4, y + ry + 95);
            ctx.stroke();
            ctx.restore();
        }

        function desenharIlustracaoAnimal(x, y, tipo, r) {
            const img = IMAGENS_ANIMAIS_ESCONDIDOS[tipo];
            if (!img || !img.complete || !img.naturalWidth) return;
            const lado = r * 2.05;
            ctx.save();
            ctx.translate(x, y);
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(img, -lado/2, -lado/2, lado, lado);
            ctx.restore();
        }
